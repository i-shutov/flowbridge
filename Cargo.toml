[workspace]
members = [
    "crates/flowbridge-core",
    "crates/flowbridge-capture",
    "crates/flowbridge-net",
    "crates/flowbridge-cli",
    "crates/flowbridge-ffi",
    "crates/flowbridge-runtime",
    "crates/flowbridge-tunnel",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
flowbridge-core = { path = "crates/flowbridge-core" }
flowbridge-net = { path = "crates/flowbridge-net" }
flowbridge-runtime = { path = "crates/flowbridge-runtime" }
flowbridge-tunnel = { path = "crates/flowbridge-tunnel" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

