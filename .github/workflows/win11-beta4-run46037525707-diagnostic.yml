            def file_sha(path):
                info = check_path(path)
                require(stat.S_ISREG(info.st_mode) and info.st_size <= 100_000_000, 'PROBE_INPUT_NOT_BOUNDED_REGULAR_FILE')
                with path.open('rb') as stream:
                    return hashlib.file_digest(stream, 'sha256').hexdigest()

            def decode_process_output(data):
                if not data:
                    return '', 'empty'
                if data.startswith((b'\xff\xfe', b'\xfe\xff')):
                    return data.decode('utf-16', 'replace'), 'utf-16-bom'
                if data.startswith(b'\xef\xbb\xbf'):
                    return data.decode('utf-8-sig', 'replace'), 'utf-8-bom'
                if len(data) > 10 and data[1::2].count(b'\0') > len(data) // 6:
                    return data.decode('utf-16-le', 'replace'), 'utf-16-le'
                if len(data) > 10 and data[0::2].count(b'\0') > len(data) // 6:
                    return data.decode('utf-16-be', 'replace'), 'utf-16-be'
                try:
                    return data.decode('utf-8'), 'utf-8'
                except UnicodeDecodeError:
                    return data.decode('cp1252', 'replace'), 'cp1252-fallback'

            def summarize_process_output(data):
                text, encoding = decode_process_output(data)
                lines = [line for line in text.splitlines() if line.strip()]
                excerpts = [line for line in lines if NSIS_IMPORTANT.search(line)][-10:] or lines[-4:]
                return {
                    'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'encoding': encoding,
                    'lines': len(lines), 'known_files_or_symbols': [name for name in NSIS_NAMES if name.lower() in text.lower()],
                    'excerpts': [redact_nsis_line(line) for line in excerpts],
