# This privileged runner accepts only a manual dispatch from trusted main.
name: Windows 11 private beta.4 NSIS compiler diagnosis and replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win11-vps-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  private-beta4-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'i-shutov/flowbridge' }}
    runs-on: [self-hosted, Windows, X64, win11-flowbridge]
    timeout-minutes: 5
    steps:
      - name: Inspect retained inputs and replay only NSIS into a new private directory
        shell: cmd
        working-directory: C:\
        env:
          NoDefaultCurrentDirectoryInExePath: '1'
          FLOWBRIDGE_LOG_GUARD: |
            import ctypes
            from ctypes import wintypes
            import hashlib
            from io import BytesIO
            import json
            import os
            from pathlib import Path
            import re
            import stat
            import subprocess
            import sys
            from zipfile import ZipFile

            BASE = Path(r'C:\FlowBridge\private-candidates')
            RUN = BASE / 'run-beta4-46037525707-1'
            PYTHON = BASE / 'toolchain-45986630920-1/python/tools/python.exe'
            PYTHON_SHA = ('0e667928bb4f19573c6cd88f65133b2e07b243a5c716f335b56aa66bb9ec6f82328'
                          '256d22c3a29e23a0276ac5c6a6d786211feab524890ad1e56629196c6b29c')
            os.environ.pop('FLOWBRIDGE_LOG_GUARD', None)
            os.environ.pop('FLOWBRIDGE_LOG_SCAN', None)
            os.environ.pop('FLOWBRIDGE_NSIS_SCAN', None)
            os.environ.pop('FLOWBRIDGE_NSIS_VERIFY', None)
            os.environ.pop('FLOWBRIDGE_NSIS_PROBES', None)
            os.environ.pop('FLOWBRIDGE_NSIS_REPLAY', None)
            os.environ.pop('FLOWBRIDGE_NSIS_RESULT', None)

            class Blocked(Exception):
                pass

            def require(test, reason):
                if not test:
                    raise Blocked(reason)

            def check_path(path):
                for part in (*reversed(path.parents), path):
                    info = part.lstat()
                    require(not stat.S_ISLNK(info.st_mode)
                            and not info.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT,
                            'LOCAL_PATH_REPARSE_POINT')
                return info

            def guard():
                require(os.name == 'nt' and sys.maxsize > 2**32, 'NATIVE_WINDOWS_X64_REQUIRED')
                version = sys.getwindowsversion()
                require(version.product_type == 1 and (version.major, version.minor) == (10, 0)
                        and version.build >= 22000, 'WINDOWS_11_CLIENT_REQUIRED')
                require(os.environ.get('COMPUTERNAME', '').casefold() == 'vm-326272'
                        and os.environ.get('RUNNER_NAME') == 'win11-flowbridge', 'UNEXPECTED_HOST')
                kernel = ctypes.WinDLL('kernel32.dll')
                process = kernel.GetCurrentProcess
                process.restype = wintypes.HANDLE
                wow64 = kernel.IsWow64Process2
                wow64.argtypes = (wintypes.HANDLE, ctypes.POINTER(wintypes.USHORT),
                                  ctypes.POINTER(wintypes.USHORT))
                wow64.restype = wintypes.BOOL
                machine, native = wintypes.USHORT(), wintypes.USHORT()
                require(wow64(process(), ctypes.byref(machine), ctypes.byref(native))
                        and machine.value == 0 and native.value == 0x8664, 'NATIVE_WINDOWS_X64_REQUIRED')
                admin = ctypes.WinDLL('shell32.dll').IsUserAnAdmin
                admin.restype = wintypes.BOOL
                require(admin(), 'ELEVATED_ADMIN_REQUIRED')
                session_id = ctypes.WinDLL('kernel32.dll').ProcessIdToSessionId
                session_id.argtypes = (wintypes.DWORD, ctypes.POINTER(wintypes.DWORD))
                session_id.restype = wintypes.BOOL
                session = wintypes.DWORD()
                require(session_id(os.getpid(), ctypes.byref(session)) and session.value == 0,
                        'WINDOWS_SERVICE_SESSION_REQUIRED')
                system = Path(os.environ['SystemRoot']) / 'System32'
                account = subprocess.check_output([str(system / 'whoami.exe')], timeout=15)
                require(account.strip().lower() == rb'vm-326272\admin', 'UNEXPECTED_SERVICE_ACCOUNT')
                powershell = system / 'WindowsPowerShell/v1.0/powershell.exe'
                policy = subprocess.check_output(
                    [str(powershell), '-NoProfile', '-NonInteractive', '-Command', 'Get-ExecutionPolicy'],
                    timeout=15)
                require(policy.strip() == b'Restricted', 'EXPECTED_RESTRICTED_EXECUTION_POLICY')
                require(Path(sys.executable) == PYTHON and sys.version_info[:3] == (3, 13, 17),
                        'PINNED_PYTHON_UNAVAILABLE')
                check_path(PYTHON)
                archive = PYTHON.parents[2] / 'python.nupkg'
                check_path(archive)
                with archive.open('rb') as stream:
                    archive_bytes = stream.read(40_000_001)
                require(len(archive_bytes) <= 40_000_000
                        and hashlib.sha512(archive_bytes).hexdigest() == PYTHON_SHA, 'PINNED_PYTHON_ARCHIVE_MISMATCH')
                with ZipFile(BytesIO(archive_bytes)) as package:
                    for name in ('python.exe', 'python313.dll'):
                        path = PYTHON.parent / name
                        check_path(path)
                        require(path.read_bytes() == package.read('tools/' + name), 'PINNED_PYTHON_BINARY_MISMATCH')

          FLOWBRIDGE_LOG_SCAN: |
            PHASES = {
                'version_check_pass': r'"version_consistency"\s*:\s*"PASS"',
                'cargo_build': r'(?m)^\+ cargo build\b',
                'cargo_resolve_output': r'(?m)^\s*(?:Downloading|Updating) crates\.io',
                'rust_compiling': r'(?m)^\s*Compiling (?:flowbridge-|[A-Za-z0-9_]+ v)',
                'cmake_configure': r'(?m)^\+ cmake -S\b',
                'cmake_build': r'(?m)^\+ cmake --build\b',
                'nsis_compile': r'(?mi)^\+ .*makensis\.exe\b',
            }
            GIT_OPERATIONS = ('update-index', 'write-tree', 'apply', 'hash-object', 'archive', 'commit-tree',
                              'update-ref', 'status', 'rev-parse', 'init')
            MESSAGES = {
                'source_sha_not_pinned': 'source_sha_not_pinned',
                'source_tree_not_pinned': 'source_tree_not_pinned',
                'source_worktree_dirty': 'source_worktree_dirty',
                'source_archive_changed_tree': 'source_archive_changed_tree',
                'candidate_tree_not_pinned': 'candidate_tree_not_pinned',
                'candidate_source_worktree_dirty': 'candidate_source_worktree_dirty',
                'nsis_compiler_version_check_failed': 'nsis_compiler_version_check_failed',
                'nsis_zip_sha256_mismatch': 'nsis_zip_sha256_mismatch',
                'nsis_archive_requires_one_bin_compiler': 'nsis_archive_requires_one_bin_compiler',
                'nsis_archive_missing_build_resources': 'nsis_archive_missing_build_resources',
                'nsis_archive_unsafe_path': 'nsis_archive_unsafe_path',
                'nsis_local_extraction_failed': 'nsis_local_extraction_failed',
                'windows_11_build_required': 'windows_11_build_required',
                'local_path_reparse_point': 'local_path_reparse_point',
                'does not match index': 'git_worktree_index_mismatch',
                'patch does not apply': 'git_patch_does_not_apply',
                'needs update': 'git_index_needs_update',
                'uncommitted source files': 'dirty_metadata_source',
                'generated native win32 x64 build directory': 'metadata_cmake_directory_rejected',
                'generated msvc compiler identity': 'metadata_msvc_identity_missing',
                'incomplete or non-static windows release settings': 'metadata_release_settings_rejected',
                'invalid x86 pe header in nsis distribution member': 'metadata_nsis_resource_pe_rejected',
                'nsis compiler must be inside': 'metadata_nsis_compiler_outside_distribution',
                'rust runtime license missing': 'metadata_rust_license_missing',
                'no actual license files': 'metadata_crate_license_missing',
                'failed to get': 'cargo_dependency_error',
                'download of config.json failed': 'cargo_registry_unavailable',
                'could not resolve host': 'network_host_resolution_failed',
                'error: could not compile': 'rust_crate_compile_failed',
                'file: no files found': 'nsis_input_file_missing',
                'plugin not found': 'nsis_plugin_not_found',
                'error in script': 'nsis_script_error',
                'system cannot find the path specified': 'system_path_missing',
                'not recognized as an internal or external command': 'command_not_found',
                'character maps to <undefined>': 'log_codepage_character_unmapped',
                "codec can't encode character": 'log_codec_cannot_encode_character',
                "codec can't encode characters": 'log_codec_cannot_encode_characters',
                'ordinal not in range': 'log_codec_ordinal_out_of_range',
            }
            SOURCES = ('stage_internal_beta4.py', 'stage_internal_beta3.py', 'internal_windows_build_preflight.py',
                       'build-explicit-beta.py', 'explicit_beta_metadata.py', 'subprocess.py', 'pathlib.py',
                       'explicit_beta_acceptance.py', '__init__.py', '_local.py')
            ERRORS = ('StagingError', 'WindowsBuildPreflightError', 'CalledProcessError', 'TimeoutExpired',
                      'FileNotFoundError', 'FileExistsError', 'PermissionError', 'OSError', 'ValueError',
                      'RuntimeError', 'KeyError', 'UnicodeDecodeError', 'UnicodeEncodeError',
                      'BrokenPipeError', 'TypeError', 'ImportError',
                      'ModuleNotFoundError', 'ParseError', 'AttributeError', 'Rejected')
            PATHS = {
                'candidate_source': 'candidate',
                'candidate_git_head': 'candidate/.git/HEAD',
                'candidate_git_index': 'candidate/.git/index',
                'nsis_extraction': 'candidate-nsis-toolchain',
                'ffi_binary': 'candidate/target/release/flowbridge_ffi.dll',
                'native_cmake_cache': 'candidate/build/windows-explicit-beta/CMakeCache.txt',
                'native_gui': 'candidate/build/windows-explicit-beta/Release/FlowBridge.exe',
                'installer_output': 'candidate/artifacts/FlowBridge-0.3.0-beta.4-windows-x64-setup.exe',
                'package_metadata': 'candidate/build/explicit-beta-payload/BUILD-METADATA.json',
                'package_manifest': 'candidate/build/verification/explicit-beta-package.json',
                'checkpoint': 'candidate-CHECKPOINT.json',
            }

            def scan(content):
                lower = content.lower()
                classes = [name for name in ERRORS if re.search(r'(?m)^\S*\b' + name + r':', content)]
                traceback_frames = []
                for line in content.splitlines():
                    if not line.startswith('  File '):
                        continue
                    frame = re.fullmatch(r'  File "[^"\r\n]*[\\/]([^"\\/\r\n]+)", line ([0-9]{1,5}), in .*', line)
                    if frame and frame[1] in SOURCES:
                        traceback_frames.append({'file': frame[1], 'line': int(frame[2])})
                failures = [line for line in content.splitlines() if 'CalledProcessError:' in line]
                git_failures = sorted({name for name in GIT_OPERATIONS for line in failures
                                       if "'git'" in line and "'" + name + "'" in line})
                exit_codes = [int(code) for line in failures
                              for code in re.findall(r'returned non-zero exit status ([0-9]{1,10})\.', line)]
                compiler_codes = sorted(set(re.findall(
                    r'(?i)\berror(?:\[|\s+)(E[0-9]{4}|(?:MSB|LNK|C|RC|NU|NETSDK)[0-9]{4})\b',
                    content.upper(), flags=re.I)))[:24]
                windows_codes = sorted({int(code) for code in re.findall(r'\[WinError ([0-9]{1,8})\]', content)})
                return {'phase_signals': [name for name, pattern in PHASES.items() if re.search(pattern, content)],
                        'error_signals': sorted({name for marker, name in MESSAGES.items() if marker in lower}),
                        'python_exceptions': classes,
                        'traceback_frames': traceback_frames[-24:], 'git_subprocesses_failed': git_failures,
                        'subprocess_exit_codes': exit_codes[-8:], 'compiler_error_codes': compiler_codes,
                        'windows_error_codes': windows_codes[:16]}

          FLOWBRIDGE_NSIS_SCAN: |
            NSIS_FLAGS = ('/NOCONFIG', '/V4', '/INPUTCHARSET', '/DPAYLOAD_DIR',
                          '/DOUTPUT_FILE', '/DVERSION', '/DFILE_VERSION')
            NSIS_WORDS = set("""
                a abbreviations abort aborted aborting access adding all already an and ansi arguments
                as at bad because bmp cannot can't change character charset code command commands
                compile compiler compiling compressor configuration conflict could couldn't create created
                creating creation current data debug denied directory disk dll does duplicate edit empty
                end error errors except exist exists failed failure fatal file filename files finished
                found from generated has header help id in include including incompatible incorrect
                initialization input installer insufficient internal invalid is item key language last
                line literal load loading lock locked lzma macro makensis mandatory memory missing must
                name no noconfig non not nsis object of on one only open opening option options or
                output out outfile overwritten parameter parameters parsing path permission plugin
                plugins plugin:: possible preprocessor privileges process processed processing read readable
                reading requires reserved resource resources returning script scripts size skipped
                specify starting string stub stubs supported syntax target the to too true unable
                unexpected unicode uninstaller unknown unsupported usage use used using utf8 utf-8
                valid value variable version warning was while windows with write writing written
                x64 x86 x86-unicode zip !addincludedir !addplugindir !error !include !insertmacro
            """.split())
            NSIS_NAMES = (
                'FlowBridgeExplicitBeta.nsi', 'MUI2.nsh', 'LogicLib.nsh', 'x64.nsh', 'WinVer.nsh',
                'nsisconf.nsh', 'System.dll', 'LangDLL.dll', 'nsDialogs.dll', 'lzma_solid-x86-unicode',
                'LICENSE', 'BUILD-METADATA.json', 'SBOM.cdx.json', 'THIRD_PARTY_NOTICES.txt',
                'FlowBridge-0.3.0-beta.4-windows-x64-setup.exe', 'FlowBridge.exe', 'flowbridge_ffi.dll',
                'PAYLOAD_DIR', 'OUTPUT_FILE', 'FILE_VERSION', 'VERSION', 'NSISDIR',
            )
            NSIS_CANONICAL = {name.lower(): name for name in (*NSIS_NAMES, *NSIS_FLAGS)}
            NSIS_IMPORTANT = re.compile(r"""(?i)\b(?:error|fatal|warning|usage|can't|cannot|failed|
                failure|invalid|unknown|unable|not\s+found|could\s+not|access\s+denied|aborting|missing)\b""", re.X)

            def redact_nsis_line(line):
                shown = []
                for token in line[:1024].split()[:64]:
                    value = token.strip(' \'"`.,;:?!()[]{}<>').lower()
                    if value in NSIS_CANONICAL:
                        word = NSIS_CANONICAL[value]
                    elif value in NSIS_WORDS:
                        word = value
                    elif re.fullmatch(r'(?:warning|error)?[0-9]{1,6}', value):
                        word = value
                    else:
                        word = '[redacted]'
                    if word != '[redacted]' or not shown or shown[-1] != word:
                        shown.append(word)
                return ' '.join(shown)[:420]

            def nsis_details(content):
                lines = content.splitlines()
                start = next((i for i, line in enumerate(lines)
                              if re.match(r'(?i)^\+ .*makensis\.exe\b', line)), None)
                if start is None:
                    return {'logged_nsis_call': False}
                command = lines[start].upper()
                end = next((i for i in range(start + 1, len(lines))
                            if lines[i].startswith('Traceback (most recent call last):')), len(lines))
                details = [line for line in lines[start + 1:end] if line.strip()]
                excerpts = [line for line in details if NSIS_IMPORTANT.search(line)][-12:]
                if not excerpts:
                    excerpts = details[-10:]
                named = [name for name in NSIS_NAMES if any(name.casefold() in line.casefold()
                         for line in details)]
                markers = {
                    'processing_script': any('processing script file' in line.lower() for line in details),
                    'writing_output': any('output:' in line.lower() or 'writing output' in line.lower() for line in details),
                    'showed_usage': any(re.search(r'(?i)\busage\b', line) for line in details),
                    'contains_error': any(NSIS_IMPORTANT.search(line) for line in details),
                }
                return {'logged_nsis_call': True, 'logged_compiler_flags': [flag for flag in NSIS_FLAGS if flag in command],
                        'compiler_output_lines': len(details), 'known_files_or_symbols': named,
                        'compiler_markers': markers,
                        'sanitized_compiler_excerpts': [redact_nsis_line(line) for line in excerpts]}

          FLOWBRIDGE_NSIS_VERIFY: |
            import ast
            from pathlib import PurePosixPath

            BUILDER_REL = 'packaging/windows/build-explicit-beta.py'
            BUILDER_SHA = 'd41bb18dd2009243e3d1995e77a58e988bf13380cc88e739bb9e3cd9a1f18350'
            BUILDER_BLOB = 'a1e726201812afc1e73d1adcaf5361f5708fc41c'
            CANDIDATE_TREE = 'ce336e83bb724a65bf512e79e286c97fb0cb3190'
            NSIS_ARCHIVE_SHA = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
            NSIS_RESOURCE_MEMBERS = (
                'COPYING', 'Include/MUI2.nsh', 'Stubs/lzma_solid-x86-unicode',
                'Plugins/x86-unicode/System.dll', 'Plugins/x86-unicode/LangDLL.dll',
                'Plugins/x86-unicode/nsDialogs.dll',
            )

            def describe_builder():
                source = RUN / 'candidate'
                builder = source / BUILDER_REL
                info = check_path(builder)
                require(stat.S_ISREG(info.st_mode) and info.st_size < 100_000, 'INVALID_RETAINED_BUILDER_FILE')
                data = builder.read_bytes()
                lines = data.decode('utf-8').splitlines()
                statements = {
                    'print(proc.stdout': 'print_compiler_stdout',
                    'print(proc.stderr': 'print_compiler_stderr',
                    'proc.check_returncode(': 'check_subprocess_exit_status',
                    'proc = subprocess.run(': 'invoke_subprocess',
                    'run([str(nsis)': 'invoke_nsis',
                }
                names = {}
                for number in (36, 37, 39, 40, 41, 42, 43, 143, 191):
                    line = lines[number - 1] if number <= len(lines) else ''
                    names[str(number)] = next((name for needle, name in statements.items() if needle in line), 'other')
                report = {
                    'retained_builder_bytes': len(data),
                    'retained_builder_sha256': hashlib.sha256(data).hexdigest(),
                    'retained_builder_matches_tree_blob': hashlib.sha256(data).hexdigest() == BUILDER_SHA,
                    'computed_git_blob_matches': hashlib.sha1(
                        f'blob {len(data)}\0'.encode() + data, usedforsecurity=False).hexdigest() == BUILDER_BLOB,
                    'retained_builder_line_classification': names,
                    'git_audit_available': False,
                }
                for prefix in (Path(os.environ['ProgramFiles']), Path(os.environ['LOCALAPPDATA']) / 'Programs'):
                    git = prefix / 'Git/cmd/git.exe'
                    try:
                        check_path(git)
                    except FileNotFoundError:
                        continue
                    env = {key: value for key, value in os.environ.items() if not key.startswith(('GIT_', 'ACTIONS_'))}
                    env.update(GIT_OPTIONAL_LOCKS='0', GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=os.devnull,
                               GIT_TERMINAL_PROMPT='0')
                    startup = [str(git), '-C', str(source)]
                    index = subprocess.check_output(startup + ['ls-files', '--stage', '--', BUILDER_REL],
                                                    env=env, timeout=15).decode('ascii').strip().split()
                    tree = subprocess.check_output(startup + ['rev-parse', 'HEAD^{tree}'],
                                                   env=env, timeout=15).decode('ascii').strip()
                    report.update(git_audit_available=True, head_tree_matches=tree == CANDIDATE_TREE,
                                  index_builder_matches=index == ['100644', BUILDER_BLOB, '0', BUILDER_REL])
                    break
                return report

            def classify_failed_command(raw, compiler):
                result = {}
                for line in raw.splitlines():
                    if 'CalledProcessError:' not in line or len(line) > 8192:
                        continue
                    match = re.search(r"Command '(\[.*\])' returned non-zero exit status ([0-9]{1,10})\.", line)
                    if not match:
                        continue
                    try:
                        arguments = ast.literal_eval(match[1])
                    except (ValueError, SyntaxError):
                        continue
                    if not isinstance(arguments, list) or not arguments or not all(isinstance(arg, str) for arg in arguments):
                        continue
                    exe = Path(arguments[0])
                    if exe.name.casefold() != 'makensis.exe':
                        continue
                    result = {
                        'exact_pinned_nsis_binary': exe == compiler,
                        'exit_code': int(match[2]),
                        'flag_sequence': [arg.split('=', 1)[0] for arg in arguments[1:]
                                          if arg.split('=', 1)[0] in NSIS_FLAGS],
                        'utf8_input_requested': 'UTF8' in arguments[1:],
                        'expected_nsi_script': arguments[-1].replace('\\', '/') == 'packaging/windows/FlowBridgeExplicitBeta.nsi',
                    }
                return result

          FLOWBRIDGE_NSIS_PROBES: |
            def inspect_verified_compiler(raw):
                archive_file = None
                for path in (BASE.parent / 'toolchains/nsis-3.13.zip',
                             BASE / 'run-45986630920-1/nsis-3.13.zip', RUN / 'nsis-3.13.zip'):
                    try:
                        check_path(path)
                    except FileNotFoundError:
                        continue
                    archive_file = path
                    break
                require(archive_file is not None, 'LOCAL_PINNED_NSIS_ARCHIVE_MISSING')
                with archive_file.open('rb') as stream:
                    data = stream.read(10_000_001)
                require(len(data) <= 10_000_000 and hashlib.sha256(data).hexdigest() == NSIS_ARCHIVE_SHA,
                        'NSIS_ARCHIVE_SHA_MISMATCH')
                distribution = RUN / 'candidate-nsis-toolchain'
                with ZipFile(BytesIO(data)) as archive:
                    entries = [PurePosixPath(name) for name in archive.namelist()
                               if PurePosixPath(name).parts[-2:] == ('Bin', 'makensis.exe')]
                    require(len(entries) == 1 and not entries[0].is_absolute() and '..' not in entries[0].parts,
                            'PINNED_NSIS_COMPILER_ENTRY_INVALID')
                    relative = entries[0]
                    compiler = distribution.joinpath(*relative.parts)
                    check_path(compiler)
                    compiler_bytes = compiler.read_bytes()
                    require(compiler_bytes == archive.read(relative.as_posix()), 'PINNED_NSIS_COMPILER_BYTES_MISMATCH')
                    resource_root = relative.parent.parent
                    archive_names = {name.casefold(): name for name in archive.namelist()}
                    for name in NSIS_RESOURCE_MEMBERS:
                        member = resource_root / name
                        file = distribution.joinpath(*member.parts)
                        check_path(file)
                        require(file.read_bytes() == archive.read(archive_names[member.as_posix().casefold()]), 'PINNED_NSIS_RESOURCE_BYTES_MISMATCH')
                env = {**os.environ, 'NSISDIR': str(compiler.parent.parent)}
                execution = {}
                for name, args in (
                    ('version', ['/VERSION']),
                    ('header_default', ['/NOCONFIG', '/HDRINFO']),
                    ('header_build_flags', ['/NOCONFIG', '/V4', '/INPUTCHARSET', 'UTF8', '/HDRINFO']),
                ):
                    completed = subprocess.run([str(compiler), *args], cwd=RUN / 'candidate', env=env,
                                               capture_output=True, timeout=25, check=False)
                    execution[name] = {
                        'exit_code': completed.returncode,
                        'stdout_bytes': len(completed.stdout),
                        'stderr_bytes': len(completed.stderr),
                        'pinned_version_output': completed.stdout.strip() == b'v3.13',
                        'nsis_compile_signals': bool(re.search(rb'(?i)NSIS_(?:CONFIG|MAX_STRLEN|COMPRESS)', completed.stdout)),
                        'stderr_excerpts': [
                            redact_nsis_line(line) for line in completed.stderr[:4096].decode('utf-8', 'replace').splitlines()[-4:]
                        ],
                    }
                return {
                    'pinned_archive_sha256': NSIS_ARCHIVE_SHA,
                    'verified_compiler_sha256': hashlib.sha256(compiler_bytes).hexdigest(),
                    'resources_match_pinned_archive': True,
                    'direct_read_only_invocations': execution,
                    'retained_failed_compiler_command': classify_failed_command(raw, compiler),
                    'replay': guarded_probe(replay_nsis, compiler, env),
                }

          FLOWBRIDGE_NSIS_REPLAY: |
            import csv

            NSI_REL = 'packaging/windows/FlowBridgeExplicitBeta.nsi'
            NSI_SHA = '68eec9ddbb9dc84319c3231065cbdad433f979d031c94311d44ced5f5c633b7a'
            REPLAY_INSTALLER = 'FlowBridge-0.3.0-beta.4-windows-x64-setup.exe'
            PAYLOAD_ORIGINS = {
                'FlowBridge.exe': 'build/windows-explicit-beta/Release/FlowBridge.exe',
                'flowbridge-cli.exe': 'target/release/flowbridge.exe',
                'flowbridge_ffi.dll': 'target/release/flowbridge_ffi.dll',
                'LICENSE': 'LICENSE',
                'README.txt': 'packaging/windows/README-EXPLICIT-BETA.txt',
                'licenses/nlohmann-json-LICENSE.MIT': 'third_party/nlohmann/LICENSE.MIT',
