name: R39 Windows 11 lab scripts static & audit-only tests (NO VM/driver)
on:
  push:
    branches:
      - feat/r39-win11-dev-lab-20261108
    paths:
      - research/wfp-ale/lab-win11/**
      - .github/workflows/research-g2-win11-lab-tools.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-readonly-lab-qa:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse every PowerShell script and run only read-only audit commands
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='research/wfp-ale/lab-win11'
          $files=@(Get-ChildItem -LiteralPath $base -Filter '*.ps1' -File)
          if($files.Count -lt 5){throw 'Expected at least five R39 lab scripts'}
          $checked=@()
          foreach($file in $files){
            $tokens=$null
            $errors=$null
            $ast=[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){
              foreach($e in $errors){Write-Output ("PARSER: "+$file.Name+" "+$e.Message)}
              throw ('PowerShell parser failed: '+$file.Name)
            }
            $checked+=$file.Name
          }
          New-Item -ItemType Directory -Force build/r39-win11 | Out-Null
          & "$base/host-preflight.ps1" -OutputPath 'build/r39-win11/host-preflight.json' | Out-Null
          $audit=Get-Content 'build/r39-win11/host-preflight.json' -Raw|ConvertFrom-Json -AsHashtable
          if($audit.any_host_changed -ne $false -or $audit.driver_installed -ne $false -or $audit.ready_to_create -ne $false -or ($audit.blockers -notcontains 'github_actions_runner_not_authorized_lab_host')){throw 'Hosted Windows must NOT be eligible for VM creation'}
          & "$base/new-labvm.ps1" -OutputPath 'build/r39-win11/plan-only.json' | Out-Null
          $plan=Get-Content 'build/r39-win11/plan-only.json' -Raw|ConvertFrom-Json -AsHashtable
          if($plan.mode -ne 'AUDIT_ONLY' -or $plan.vm_created -ne $false -or $plan.host_bcd_modified -ne $false){throw 'Provisioner violated audit-only boundary'}
          & "$base/guest-testmode.ps1" -OutputPath 'build/r39-win11/guest-readonly.json' | Out-Null
          $guest=Get-Content 'build/r39-win11/guest-readonly.json' -Raw|ConvertFrom-Json -AsHashtable
          if($guest.host_modified -ne $false -or $guest.bcd_test_mode_requested -ne $false){throw 'Guest audit changed BCD'}
          # Reject accidental privileged driver/VM writes in read-only preflight.
          $tokens=$null
          $parseErrors=$null
          $readAst=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $base 'host-preflight.ps1'),[ref]$tokens,[ref]$parseErrors)
          $commands=$readAst.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.CommandAst]
            }, $true)
          foreach($cmd in $commands){
            if($cmd.GetCommandName() -in @('New-VM','Set-VMFirmware','bcdedit.exe','New-SelfSignedCertificate','sc.exe','pnputil.exe')){
              throw ('Forbidden actual preflight command AST: '+$cmd.GetCommandName())
            }
          }
          [ordered]@{
            schema='r39-win11-lab-no-load-ci-v1'
            scripts_parsed=$checked
            real_win11_vm_created=$false
            real_driver_test_signed=$false
            host_change_performed=$false
            native_ale_redirect_observed=$false
            g2_pass=$false
            result='PASS_STATIC_AND_AUDIT_ONLY'
          }|ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'build/r39-win11/ci-result.json' -Encoding utf8
      - name: Download exact prior unsigned R39 candidate (READ ONLY)
        uses: actions/download-artifact@v4
        with:
          name: FlowBridge-R24-kernel-broker-42465140005
          run-id: 42465140005
          github-token: ${{ github.token }}
          path: build/r39-win11/pinned
      - name: Verify exact unsigned hashes and ensure a changed SYS is rejected
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='research/wfp-ale/lab-win11'
          $sys='build/r39-win11/pinned/flowbridge_g2_witness.sys'
          $inf='build/r39-win11/pinned/signing-r38/FlowBridgeG2R38/flowbridge_g2_r38.inf'
          & "$base/sign-lab-driver.ps1" -UnsignedSys $sys -UnsignedInf $inf -OutputPath 'build/r39-win11/unsigned-audit.json' | Out-Null
          $good=Get-Content 'build/r39-win11/unsigned-audit.json' -Raw|ConvertFrom-Json -AsHashtable
          if($good.status -ne 'AUDIT_ONLY' -or -not $good.original_source_hashes_verified -or $good.driver_signed){throw 'Exact-source read-only pre-sign audit failed'}
          $bad='build/r39-win11/flowbridge_g2_witness.sys'
          Copy-Item -LiteralPath $sys -Destination $bad
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $bad))
          $bytes[4096]=$bytes[4096] -bxor 1
          [IO.File]::WriteAllBytes((Resolve-Path $bad),$bytes)
          & pwsh -NoProfile -File "$base/sign-lab-driver.ps1" -UnsignedSys $bad -UnsignedInf $inf -OutputPath 'build/r39-win11/mutated-audit.json' | Out-Null
          $negativeExitCode=$LASTEXITCODE
          # GitHub pwsh wrapper exits with the most recent native exit code.
          # A negative-test expected exit=2 is a PASS here; reset it after asserting.
          $global:LASTEXITCODE=0
          if($negativeExitCode -ne 2){throw 'Mutated .sys did not fail closed'}
          $badReport=Get-Content 'build/r39-win11/mutated-audit.json' -Raw|ConvertFrom-Json -AsHashtable
          if($badReport.status -ne 'BLOCKED' -or $badReport.driver_signed -or $badReport.original_source_hashes_verified){throw 'Mutation was incorrectly admitted'}
          [ordered]@{exact_source_sha256_verified=$true;mutated_source_blocked=$true;driver_signed=$false;native_redirect_executed=$false;g2_pass=$false}|ConvertTo-Json|Set-Content 'build/r39-win11/candidate-qa.json' -Encoding utf8
      - name: Package exact reviewed R39 Win11 lab scripts, no executables or keys
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive='build/r39-win11/FlowBridge-R39-Win11Lab-Toolkit.zip'
          Compress-Archive -Path 'research/wfp-ale/lab-win11/*' -DestinationPath $archive -Force
          $hash=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{source_sha=$env:GITHUB_SHA;toolkit_zip_sha256=$hash;contains_private_keys=$false;contains_kernel_binaries=$false;contains_vm_image=$false;vm_created=$false;g2_pass=$false}|ConvertTo-Json|Set-Content -LiteralPath 'build/r39-win11/toolkit-manifest.json' -Encoding utf8
          Write-Output "R39 lab toolkit ZIP SHA256: $hash (scripts only)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowBridge-R39-Win11Lab-ReadOnly-${{ github.run_id }}
          path: |
            build/r39-win11/*.json
            build/r39-win11/FlowBridge-R39-Win11Lab-Toolkit.zip
          retention-days: 14
          if-no-files-found: warn
