name: Integrate checksum-verified Win32 rule editor
on:
  push:
    branches: [feat/win32-visual-rule-editor-20261030]
    paths: [tools/checkpoints/rules.partB.b64]
permissions:
  contents: write
concurrency:
  group: flowbridge-one-shot-rule-editor
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'i-shutov/flowbridge' && github.event.head_commit.message == 'Materialize validated Win32 rule editor patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check pinned parent and patch before applying
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/win32-visual-rule-editor-20261030
          git merge-base --is-ancestor 0498f97d5b6f0e0d3034dfc94a99c3d0a53a74ac HEAD
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess,tempfile
          encoded=''.join(pathlib.Path('tools/checkpoints/rules.part'+p+'.b64').read_text().strip() for p in ('A','B'))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          expected='231ceafcbc7eeb707457bd9207b9d59c55b065fda2585c1519a0988cd8521ccb'
          if hashlib.sha256(patch).hexdigest()!=expected: raise SystemExit('Source patch digest mismatch')
          allowed={'.github/workflows/ci.yml','docs/qa/VISUAL_RULE_EDITOR_WINDOWS.md',
                   'native/windows/CMakeLists.txt','native/windows/main.cpp',
                   'native/windows/rule_editor_win32.hpp','native/windows/rule_model.hpp',
                   'tests/rule_model_test.cpp','tests/windows_native_smoke.cpp'}
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch);f.flush()
              found={row.split('\t',2)[2] for row in subprocess.check_output(['git','apply','--numstat',f.name],text=True).splitlines()}
              if found!=allowed: raise SystemExit('Changed path allowlist mismatch')
              subprocess.run(['git','apply','--check','--index',f.name],check=True)
              subprocess.run(['git','apply','--index',f.name],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Source files applied at reviewed SHA-256',expected)
          PY
          git rm -- .github/workflows/integrate-reviewed-rule-editor.yml tools/checkpoints/rules.partA.b64 tools/checkpoints/rules.partB.b64
          git diff --cached --check
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "FlowBridge Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(windows): native visual rule editor with atomic Rust-validated changes and GUI QA"
          git push origin "HEAD:$GITHUB_REF"
