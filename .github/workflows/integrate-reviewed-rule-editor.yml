name: Integrate checksum-verified Win32 rule editor
on:
  push:
    branches: [feat/win32-visual-rule-editor-20261030]
    paths: [tools/checkpoints/visual-rule-editor.patch]
permissions:
  contents: write
concurrency:
  group: flowbridge-one-shot-rule-editor
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'i-shutov/flowbridge' && github.event.head_commit.message == 'Materialize validated Win32 rule editor patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify pinned SHA-256 and exact reviewed source-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/win32-visual-rule-editor-20261030
          git merge-base --is-ancestor 0498f97d5b6f0e0d3034dfc94a99c3d0a53a74ac HEAD
          python - <<'PY'
          import hashlib,pathlib,subprocess
          path='tools/checkpoints/visual-rule-editor.patch'
          patch=pathlib.Path(path).read_bytes()
          expected='231ceafcbc7eeb707457bd9207b9d59c55b065fda2585c1519a0988cd8521ccb'
          if hashlib.sha256(patch).hexdigest()!=expected: raise SystemExit('Reviewed patch digest mismatch')
          allowed={'.github/workflows/ci.yml','docs/qa/VISUAL_RULE_EDITOR_WINDOWS.md',
                   'native/windows/CMakeLists.txt','native/windows/main.cpp',
                   'native/windows/rule_editor_win32.hpp','native/windows/rule_model.hpp',
                   'tests/rule_model_test.cpp','tests/windows_native_smoke.cpp'}
          stats=subprocess.check_output(['git','apply','--numstat',path],text=True)
          found={row.split('\t',2)[2] for row in stats.splitlines()}
          if found!=allowed: raise SystemExit('Reviewed patch path allowlist mismatch')
          subprocess.run(['git','apply','--check','--index',path],check=True)
          subprocess.run(['git','apply','--index',path],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Reviewed source SHA-256:',expected)
          PY
          git rm -- .github/workflows/integrate-reviewed-rule-editor.yml tools/checkpoints/visual-rule-editor.patch
          git diff --cached --check
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "FlowBridge Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(windows): native visual rule editor with Rust validation and GUI regression"
          git push origin "HEAD:$GITHUB_REF"
