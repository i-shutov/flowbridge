name: Win11 beta.4 uninstall read-only diagnostic

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: win11-vps-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'i-shutov/flowbridge' }}
    runs-on: [self-hosted, Windows, X64, win11-flowbridge]
    timeout-minutes: 4
    steps:
      - name: Observe the exact retained headless lifecycle work directory
        shell: cmd
        working-directory: C:\
        env:
          FLOWBRIDGE_WIN11_UNINSTALL_OBSERVE: |
            import ctypes
            from datetime import datetime, timezone
            import hashlib
            import json
            import os
            from pathlib import Path
            import re
            import socket
            import subprocess
            import sys
            import types
            import urllib.request
            import winreg

            WORK = 'qa-beta4-74021cde30d34727bcce54f0d6a85283'
            INSTALL = 'FlowBridge Тест QA With Spaces'
            SETTINGS = r'Software\FlowBridgeExplicitBeta'
            UNINSTALL = r'Software\Microsoft\Windows\CurrentVersion\Uninstall\FlowBridgeExplicitBeta'
            SOURCE = '562ac8fb5087d820a4b213b08dffb24c4ed1680e'
            SOURCE_SHA = '89fcff121b1cd12c6b8a0e315bfdf73599157dd1d11e79cc713a90a73230e858'
            REPORT = {'schema': 'flowbridge-win11-beta4-uninstall-observer-v1', 'work_id': WORK,
                      'failed_run': 46041604814, 'failed_job': 140650437184}

            def preflight_module():
                url = f'https://raw.githubusercontent.com/i-shutov/flowbridge/{SOURCE}/tools/win11_explicit_beta_preflight.py'
                with urllib.request.urlopen(url, timeout=15) as response:
                    data = response.read(65537)
                if not 0 < len(data) <= 65536 or hashlib.sha256(data).hexdigest() != SOURCE_SHA:
                    raise RuntimeError('Preflight pin mismatch')
                module = types.ModuleType('win11_explicit_beta_preflight')
                exec(compile(data, '<pinned-win11-preflight>', 'exec'), module.__dict__)
                return module

            def typed_role(path, work, preflight):
                parts = path.relative_to(work).parts
                if not parts:
                    return 'work'
                if parts[0] == INSTALL:
                    child = '/'.join(parts[1:])
                    if not child:
                        return 'install'
                    if child in preflight.PAYLOAD | {'Uninstall.exe', 'qa-preserve-user-file.txt',
                                                       'licenses', 'resources', 'examples'}:
                        return 'install/' + child
                if parts[0] == 'tmp':
                    if len(parts) == 1:
                        return 'tmp'
                    if re.fullmatch(r'~?nsu?[0-9a-f]*\.tmp', parts[1], re.IGNORECASE):
                        area = 'tmp/' + parts[1].lower()
                        if len(parts) == 2:
                            return area
                        if len(parts) == 3 and parts[2].lower() in ('un.exe', 'un_a.exe', 'au_.exe', 'uninstall.exe',
                                                                    'system.dll', 'langdll.dll', 'nsdialogs.dll'):
                            return area + '/' + parts[2].lower()
                    return 'tmp/<other>'
                return '<other>'

            def inventory(work, preflight):
                result = []
                queue = [work]
                while queue:
                    if len(result) >= 96:
                        return {'entries': result, 'limit_reached': True}
                    path = queue.pop(0)
                    kind = preflight.path_status(path)
                    role = typed_role(path, work, preflight)
                    row = {'role': role, 'type': kind}
                    result.append(row)
                    if kind not in ('directory', 'regular_file'):
                        continue
                    details = path.lstat()
                    row['modified_utc'] = datetime.fromtimestamp(details.st_mtime, timezone.utc).isoformat()
                    if '<other>' not in role:
                        row['device_id'], row['file_id'] = details.st_dev, details.st_ino
                    if kind == 'directory':
                        if len(path.relative_to(work).parts) < 4:
                            with os.scandir(path) as scan:
                                for child in scan:
                                    queue.append(Path(child.path))
                                    if len(queue) + len(result) >= 97:
                                        break
                    else:
                        row['bytes'] = details.st_size
                        if '<other>' not in role and details.st_size <= 16777216:
                            try:
                                with path.open('rb') as source:
                                    data = source.read(details.st_size + 1)
                                row['sha256'] = (hashlib.sha256(data).hexdigest()
                                                 if len(data) == details.st_size else 'CHANGED_DURING_READ')
                            except OSError:
                                row['sha256'] = 'READ_UNAVAILABLE'
                return {'entries': result, 'limit_reached': False}

            def registry(key, view, field, owned_path):
                try:
                    with winreg.OpenKey(winreg.HKEY_CURRENT_USER, key, 0,
                                        winreg.KEY_READ | view) as handle:
                        subkeys, values, _ = winreg.QueryInfoKey(handle)
                        try:
                            location, _ = winreg.QueryValueEx(handle, field)
                            present = True
                        except FileNotFoundError:
                            location, present = None, False
                        matches = isinstance(location, str) and Path(location) == owned_path
                        return {'exists': True, 'subkey_count': subkeys, 'value_count': values,
                                'path_value_exists': present, 'path_matches_owned_install': matches}
                except FileNotFoundError:
                    return {'exists': False, 'path_value_exists': False, 'path_matches_owned_install': False}

            def processes(work, preflight):
                system = Path(os.environ.get('SystemRoot', ''))
                pwsh = system / 'System32/WindowsPowerShell/v1.0/powershell.exe'
                if not system.is_absolute() or preflight.path_status(pwsh) != 'regular_file':
                    raise RuntimeError('Trusted system PowerShell unavailable')
                code = (
                    "$ErrorActionPreference='Stop';"
                    "[Console]::OutputEncoding=[Text.UTF8Encoding]::new($false);"
                    "$root=$env:FLOWBRIDGE_OBSERVED_WORK+'\\';$hits=@();$unknown=0;"
                    "$items=Get-CimInstance -ClassName Win32_Process "
                    "-Property Name,ExecutablePath,ProcessId,ParentProcessId,SessionId,ExecutionState,CreationDate;"
                    "foreach($p in $items){"
                    "if($p.ExecutablePath -and $p.ExecutablePath.StartsWith($root,[StringComparison]::OrdinalIgnoreCase)){"
                    "$hits += [pscustomobject]@{path=$p.ExecutablePath;pid=$p.ProcessId;"
                    "parent=$p.ParentProcessId;session=$p.SessionId;state=$p.ExecutionState;"
                    "created=$p.CreationDate.ToUniversalTime().ToString('o',"
                    "[Globalization.CultureInfo]::InvariantCulture)}"
                    "}elseif(-not $p.ExecutablePath -and $p.Name -in 'Uninstall.exe','Un.exe','Un_A.exe','Au_.exe'){"
                    "$unknown++}};"
                    "ConvertTo-Json -InputObject @{owned=@($hits | Select-Object -First 24);"
                    "owned_count=$hits.Count;possible_names_with_unavailable_path=$unknown} -Compress -Depth 4"
                )
                env = dict(os.environ, FLOWBRIDGE_OBSERVED_WORK=str(work))
                run = subprocess.run([str(pwsh), '-NoProfile', '-NonInteractive', '-Command', code],
                                     env=env, capture_output=True, stdin=subprocess.DEVNULL, timeout=20)
                if run.returncode != 0:
                    raise RuntimeError('Read-only Win32_Process inventory failed')
                result = json.loads(run.stdout)
                for item in result['owned']:
                    path = Path(item.pop('path'))
                    item['image_role'] = typed_role(path, work, preflight)
                    item['running_at_observation'] = True
                return result

            phase = 'HOST'
            try:
                if (sys.platform != 'win32' or sys.maxsize <= 2**32
                        or sys.getwindowsversion().build != 22631
                        or socket.gethostname().casefold() != 'vm-326272'
                        or os.environ.get('RUNNER_NAME') != 'win11-flowbridge'):
                    raise RuntimeError('Wrong target')
                preflight = preflight_module()
                kernel = ctypes.WinDLL('kernel32', use_last_error=True)
                REPORT['host'] = preflight.windows_host(kernel)
                if preflight.current_session(kernel) != 0 or not REPORT['host']['token_elevated']:
                    raise RuntimeError('Wrong service runner token')
                phase = 'RETAINED_PATHS'
                work = Path(preflight.PRIVATE) / WORK
                if preflight.path_status(work) != 'directory':
                    raise RuntimeError('Retained workspace missing or unsafe')
                install = work / INSTALL
                temp = work / 'tmp'
                REPORT['install_type'] = preflight.path_status(install)
                REPORT['uninstaller_type'] = preflight.path_status(install / 'Uninstall.exe')
                REPORT['temp_type'] = preflight.path_status(temp)
                REPORT['work_inventory'] = inventory(work, preflight)
                phase = 'REGISTRY'
                REPORT['registry'] = {
                    name: {'settings': registry(SETTINGS, view, 'InstallDir', install),
                           'uninstall': registry(UNINSTALL, view, 'InstallLocation', install)}
                    for name, view in (('64', winreg.KEY_WOW64_64KEY), ('32', winreg.KEY_WOW64_32KEY))
                }
                REPORT['completion_predicates'] = {
                    'uninstaller_absent': REPORT['uninstaller_type'] == 'absent',
                    'uninstall_key_absent_both_views': all(not item['uninstall']['exists']
                                                           for item in REPORT['registry'].values()),
                    'private_temp_empty_directory': REPORT['temp_type'] == 'directory'
                                                    and next(temp.iterdir(), None) is None,
                }
                phase = 'PROCESSES'
                REPORT['owned_processes'] = processes(work, preflight)
                REPORT['status'] = 'READ_ONLY_OBSERVATION_COMPLETE'
                code = 0
            except Exception:
                REPORT.update(status='READ_ONLY_OBSERVATION_BLOCKED', phase=phase)
                code = 1
            print('FLOWBRIDGE_UNINSTALL_OBSERVATION ' + json.dumps(REPORT, sort_keys=True))
            sys.exit(code)
        run: |
          @echo off
          set "FLOWBRIDGE_PRIVATE_PY=C:\"
          "%FLOWBRIDGE_PRIVATE_PY%FlowBridge\private-candidates\toolchain-45986630920-1\python\tools\python.exe" -I -X utf8 -B -c "import os; exec(os.environ['FLOWBRIDGE_WIN11_UNINSTALL_OBSERVE'])" 2>nul
          exit /b %ERRORLEVEL%
