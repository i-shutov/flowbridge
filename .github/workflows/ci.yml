name: rust-and-native-applications
on:
  push:
    branches: [main]
    paths-ignore: ['native/windows/wfp/driver/**', '.github/workflows/windows-driver.yml', 'docs/**']
  pull_request:
    paths-ignore: ['native/windows/wfp/driver/**', '.github/workflows/windows-driver.yml', 'docs/**']
  workflow_dispatch:
    inputs:
      ssh_churn:
        description: "Real isolated OpenSSH churn on the first run (default 200)"
        type: choice
        required: false
        default: '200'
        options: ['200', '1000', '10000']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify IPv4/IPv6 SOCKS wire fixture (no WFP driver)
        run: python tests/wfp_wire_fixture_smoke.py --output build/verification/wfp-fixture/result.json
      - name: Preserve dual-stack wire-fixture evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-wfp-wire-fixture-${{ matrix.os }}
          path: build/verification/wfp-fixture/
          if-no-files-found: warn
          retention-days: 14
      - name: Syntax-check real-VM WFP harness without claiming driver acceptance
        run: python -m py_compile tests/windows_wfp_redirect_runtime.py tests/windows_wfp_userchain_runtime.py tests/windows_dpi_matrix_vm.py tests/windows_openssh_capacity_vm.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - run: python tests/smoke.py
      - name: Native capture session vertical integration
        run: python tests/native_vertical_integration.py --output build/verification/native/session.json
      - name: Native selected application through user-owned GUI SSH route
        run: python tests/native_user_ssh_chain_integration.py --output build/verification/native/user-ssh-two-hop.json
      - name: Preserve native-session evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-native-session-${{ matrix.os }}
          path: build/verification/native/
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise shared SSH capacity under connection bursts
        run: python tests/managed_capacity_integration.py --output build/verification/capacity/result.json
      - name: Preserve admission-control evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-capacity-${{ matrix.os }}
          path: build/verification/capacity/
          if-no-files-found: warn
          retention-days: 14
      - name: Test real SSH authentication plus 128 held channels, overload, churn and host-key rejection
        if: matrix.os == 'ubuntu-24.04'
        env:
          FLOWBRIDGE_SSH_CHURN: ${{ inputs.ssh_churn || '200' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes openssh-server
          sudo install -d -m 0755 /run/sshd
          python tests/ssh_real_integration.py --library target/debug/libflowbridge_ffi.so --output build/verification/ssh
      - uses: actions/upload-artifact@v7.0.0
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: FlowBridge-real-SSH-verification
          path: build/verification/ssh/
          if-no-files-found: warn
          retention-days: 14
      - name: Archive exact source revision
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=flowbridge/ -o "artifacts/flowbridge-source-${GITHUB_SHA}.zip" HEAD
          sha256sum artifacts/flowbridge-source-*.zip > artifacts/source-SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.0
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: FlowBridge-exact-source
          path: |
            artifacts/flowbridge-source-*.zip
            artifacts/source-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  windows-application:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo build --locked --release -p flowbridge-ffi -p flowbridge-cli
      - run: cmake -S native/windows -B build/windows -A x64 -DFLOWBRIDGE_BUILD_NATIVE_TESTS=ON -DFLOWBRIDGE_FFI_LIBRARY="$env:GITHUB_WORKSPACE/target/release/flowbridge_ffi.dll.lib"
      - run: cmake --build build/windows --config Release
      - shell: pwsh
        run: |
          Copy-Item target/release/flowbridge_ffi.dll build/windows/Release/
          New-Item -ItemType Directory -Force build/windows/Release/resources
          Copy-Item resources/presets.json build/windows/Release/resources/
          & ./build/windows/Release/FlowBridgeRuleModelTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/windows/Release/FlowBridgeProxiFyreExportTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/windows/Release/FlowBridgeNativeSmoke.exe "$env:GITHUB_WORKSPACE/build/windows/Release/FlowBridge.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native WFP capture service
        run: cmake -S native/windows/wfp -B build/windows-capture -A x64 -DFLOWBRIDGE_FFI_LIBRARY="$env:GITHUB_WORKSPACE/target/release/flowbridge_ffi.dll.lib"
      - run: cmake --build build/windows-capture --config Release
      - run: choco install nsis --yes --no-progress
      - run: python packaging/windows/build-installer.py --skip-build
      - name: Reject dependencies on a separately installed Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          New-Item -ItemType Directory -Force build/verification/windows | Out-Null
          foreach ($file in Get-ChildItem build/payload -File | Where-Object { $_.Extension -in '.exe','.dll' }) {
            $text = & $dumpbin /dependents $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $($file.Name)" }
            $text | Set-Content "build/verification/windows/$($file.Name).imports.txt"
            if (($text -join "`n") -match '(?i)(vcruntime|msvcp|concrt)\d+[^\s]*\.dll') { throw "Unexpected VC runtime dependency in $($file.Name)" }
          }
      - name: Install, run, upgrade and uninstall on Windows
        run: python tests/windows_installer_native.py --manifest docs/verification/windows-package.json --harness build/windows/Release/FlowBridgeNativeSmoke.exe --output build/verification/windows
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-windows-x64
          path: |
            artifacts/FlowBridge-*-windows-x64-setup.exe
            artifacts/FlowBridge-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish installer verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-windows-verification
          path: |
            build/verification/windows/
            docs/verification/windows-package.json
          if-no-files-found: warn
          retention-days: 14
  macos-application:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: brew install xcodegen
      - run: bash packaging/macos/build-pkg.sh local
      - name: Actual Swift controller and owned-pool lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification/macos
          xcrun swiftc -swift-version 5 -O \
            -import-objc-header native/include/flowbridge.h \
            native/macos/Shared/Bridge.swift \
            native/macos/App/EngineController.swift \
            tests/macos_engine_pool_lifecycle.swift \
            "native/macos/lib/$(uname -m)/libflowbridge_ffi.a" \
            -framework Security -framework SystemConfiguration -liconv -lresolv \
            -o build/macos/controller-pool-qa
          build/macos/controller-pool-qa | tee build/verification/macos/controller-pool.json
      - name: Install, launch and upgrade the actual macOS package
        run: python tests/macos_installer_native.py --package-dir build/macos/local/packages --output build/verification/macos
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-macos-universal-local
          path: build/macos/local/packages/*.pkg
          if-no-files-found: error
          retention-days: 14
      - name: Publish macOS installation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-macos-verification
          path: build/verification/macos/
          if-no-files-found: warn
          retention-days: 14
      - working-directory: native/macos
        run: |
          xcodebuild -project FlowBridge.xcodeproj -scheme FlowBridge -configuration Debug ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build
  # Native extension compile is not signing, activation or an interception test.
