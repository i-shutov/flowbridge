name: FlowBridge beta A3 pinned Windows owner runner static QA
on:
  pull_request:
    paths:
      - 'tools/windows/FlowBridge-ExplicitBeta-A3-Frozen.ps1'
      - '.github/workflows/flowbridge-beta-a3-frozen-operator-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-operator-negative:
    name: A3 guard / Windows PowerShell 5.1 and PowerShell 7
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: AST, exact source markers, bad-ZIP refusal without installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'tools/windows/FlowBridge-ExplicitBeta-A3-Frozen.ps1'
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw 'POWER_SHELL_PARSE_FAILURE' }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($marker in @('f5ecd48d8f81c594f755a55e7969b57d20903020', '4b51d4136878476b48946361ce1635cb6d630e62b50ca82c73df28a5902ed8b8', 'PINNED_SHA256_MISMATCH', 'A3_NATIVE_NOT_RUN')) {
            if (-not $source.Contains($marker)) { throw 'A3_SCOPE_PIN_MISSING' }
          }
          foreach ($danger in @('bcdedit', 'Set-MpPreference', 'Set-NetFirewallRule', 'New-NetFirewallRule', 'Set-DnsClientServerAddress', 'Install-WindowsFeature', 'Restart-Computer')) {
            if ($source.Contains($danger)) { throw 'A3_UNEXPECTED_SYSTEM_MUTATION' }
          }
          $root = Join-Path $env:RUNNER_TEMP ('a3-negative-' + [guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $root)
          $fake = Join-Path $root 'FlowBridge-0.3.0-beta.1-candidate-f5ecd48d8f81.zip'
          [IO.File]::WriteAllBytes($fake,[Text.Encoding]::UTF8.GetBytes('not-a-real-candidate'))
          $message = ''
          try {
            & $file -KitZip $fake -ExpectedComputerName 'INVALID-HOST-NOT-USED' -OutputRoot (Join-Path $root 'out')
          } catch { $message = $_.Exception.Message }
          if ($message -ne 'PINNED_SHA256_MISMATCH') { throw ('A3_BAD_ZIP_NOT_REJECTED: ' + $message) }
          if (Test-Path (Join-Path $root 'out')) { throw 'A3_BAD_ZIP_CREATED_EVIDENCE' }
          Write-Host 'A3_STATIC_AND_NEGATIVE_PASS; OWNER_NATIVE_NOT_RUN'
      - name: Also parse in PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/windows/FlowBridge-ExplicitBeta-A3-Frozen.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw 'POWERSHELL7_PARSE_FAILURE' }
          Write-Host 'POWER_SHELL_7_AST_PASS'
