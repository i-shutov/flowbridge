# This privileged runner accepts only a manual dispatch from trusted main.
name: Windows 11 private local beta.3 build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win11-vps-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  private-beta3:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'i-shutov/flowbridge' }}
    runs-on: [self-hosted, Windows, X64, win11-flowbridge]
    timeout-minutes: 60
    steps:
      - name: Provision pinned Python and Rust in a private local directory
        shell: cmd
        working-directory: C:\
        timeout-minutes: 15
        env:
          FLOWBRIDGE_PROVISION_SETUP: |
            $ErrorActionPreference = 'Stop'
            $ProgressPreference = 'SilentlyContinue'
            $env:FLOWBRIDGE_PROVISION_SETUP = $null
            $env:FLOWBRIDGE_PROVISION_CODE = $null
            $phase = 'EXPECTED_WIN11_RUNNER'
            $log = $null
            $script:nativeExit = 0
            $system = Join-Path $env:SystemRoot 'System32'
            $pythonVersion = '3.13.17'
            $rustVersion = '1.100.0'
            $rustupVersion = '1.29.3'
            $target = 'x86_64-pc-windows-msvc'
            $toolchain = $rustVersion + '-' + $target
            $distribution = 'https://static.rust-lang.org'
            $nuget = 'https://api.nuget.org'

            function Invoke-Local([string]$Executable, [string[]]$Arguments) {
              $ErrorActionPreference = 'Continue'
              & $Executable @Arguments *>> $log
              $script:nativeExit = $LASTEXITCODE
              if ($script:nativeExit -ne 0) { throw 'native command failed' }
            }
            function Download([string]$Url, [string]$Name, [string]$Limit) {
              Invoke-Local (Join-Path $system 'curl.exe') @('--disable', '--proto', '=https', '--proto-redir', '=https',
                '--location', '--compressed', '--fail', '--silent', '--show-error', '--connect-timeout', '20', '--max-time', '120',
                '--max-filesize', $Limit, '--output', $Name, $Url)
            }
            function Report($Data) {
              Write-Host ('FLOWBRIDGE_TOOLCHAIN_RESULT ' + ($Data | ConvertTo-Json -Compress))
            }

          FLOWBRIDGE_PROVISION_CODE: |
            try {
              $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
              $principal = New-Object Security.Principal.WindowsPrincipal($identity)
              $os = Get-CimInstance Win32_OperatingSystem
              $processors = @(Get-CimInstance Win32_Processor)
              if ($env:COMPUTERNAME -ine 'VM-326272' -or $env:RUNNER_NAME -ine 'win11-flowbridge' -or
                  $identity.Name -ine 'VM-326272\Admin' -or
                  -not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or
                  -not [Environment]::Is64BitProcess -or -not $processors.Count -or
                  @($processors | Where-Object Architecture -ne 9).Count -or
                  $os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000) { throw 'host mismatch' }

              $phase = 'PRIVATE_TOOLCHAIN_DIRECTORY'
              $parent = 'C:\FlowBridge\private-candidates'
              $run = $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT
              if ($run -cnotmatch '^[0-9]+-[0-9]+$') { throw 'invalid run identifier' }
              foreach ($path in @('C:\FlowBridge', $parent)) {
                if ((Test-Path -LiteralPath $path) -and
                    ((Get-Item -LiteralPath $path -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw 'reparse point'
                }
              }
              [void][IO.Directory]::CreateDirectory($parent)
              $root = Join-Path $parent ('toolchain-' + $run)
              New-Item -ItemType Directory -Path $root | Out-Null
              $sid = '*' + $identity.User.Value + ':(OI)(CI)F'
              $ErrorActionPreference = 'Continue'
              & (Join-Path $system 'icacls.exe') $root /inheritance:r /grant:r $sid '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' *> $null
              $script:nativeExit = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              if ($script:nativeExit -ne 0) { throw 'private ACL failed' }
              $log = Join-Path $root 'provision.log'

              $phase = 'PYTHON_REGISTRATION_DOWNLOAD'
              $registrationFile = Join-Path $root 'python.registration.json'
              Download ($nuget + '/v3/registration5-gz-semver2/python/' + $pythonVersion + '.json') $registrationFile '1048576'
              $phase = 'PYTHON_CATALOG_DOWNLOAD'
              $entry = Get-Content -LiteralPath $registrationFile -Raw | ConvertFrom-Json
              $catalogUrl = [Uri]$entry.catalogEntry
              if (-not $catalogUrl.IsAbsoluteUri -or $catalogUrl.Scheme -cne 'https' -or
                  $catalogUrl.Host -cne 'api.nuget.org' -or -not $catalogUrl.IsDefaultPort -or
                  $catalogUrl.UserInfo -or $catalogUrl.Query -or $catalogUrl.Fragment -or
                  $catalogUrl.AbsolutePath -cnotmatch '^/v3/catalog0/data/[^/]+/python\.3\.13\.17\.json$') {
                throw 'unexpected NuGet catalog URL'
              }
              $catalogFile = Join-Path $root 'python.catalog.json'
              Download $catalogUrl.AbsoluteUri $catalogFile '2097152'
              $phase = 'PYTHON_SHA512_METADATA'
              $catalog = Get-Content -LiteralPath $catalogFile -Raw | ConvertFrom-Json
              if ($catalog.id -ine 'python' -or $catalog.version -cne $pythonVersion -or
                  $catalog.packageHashAlgorithm -ine 'SHA512') { throw 'unexpected NuGet catalog identity' }
              $bytes = [Convert]::FromBase64String($catalog.packageHash)
              if ($bytes.Length -ne 64) { throw 'invalid SHA512' }
              $pythonHash = [BitConverter]::ToString($bytes).Replace('-', '')
              $phase = 'PYTHON_ARCHIVE_DOWNLOAD'
              $pythonZip = Join-Path $root 'python.nupkg'
              Download ($nuget + '/v3-flatcontainer/python/' + $pythonVersion + '/python.' + $pythonVersion + '.nupkg') $pythonZip '40000000'
              $phase = 'PYTHON_ARCHIVE_SHA512'
              if ((Get-FileHash -LiteralPath $pythonZip -Algorithm SHA512).Hash -cne $pythonHash) {
                throw 'Python hash mismatch'
              }
              $phase = 'PYTHON_EXTRACTION_AND_VERSION'
              $pythonRoot = Join-Path $root 'python'
              New-Item -ItemType Directory -Path $pythonRoot | Out-Null
              Invoke-Local (Join-Path $system 'tar.exe') @('-xf', $pythonZip, '-C', $pythonRoot)
              $python = Join-Path $pythonRoot 'tools\python.exe'
              Invoke-Local $python @('-I', '-c', 'import sys; sys.exit(0 if sys.version_info[:3] == (3,13,17) and sys.maxsize > 2**32 else 1)')

              $phase = 'RUSTUP_INPUT_DOWNLOAD'
              $rustup = Join-Path $root 'rustup.exe'
              $rustupUrl = $distribution + '/rustup/archive/' + $rustupVersion + '/' + $target + '/rustup-init.exe'
              $rustupDigest = Join-Path $root 'rustup.sha256'
              Download ($rustupUrl + '.sha256') $rustupDigest '8192'
              Download $rustupUrl $rustup '25000000'
              $phase = 'RUSTUP_INPUT_SHA256'
              $sidecar = (Get-Content -LiteralPath $rustupDigest -Raw).Trim()
              $digest = [Regex]::Match($sidecar, '^([0-9a-fA-F]{64})(?:\s+\*?rustup-init\.exe)?$')
              if (-not $digest.Success) { throw 'invalid SHA256 sidecar' }
              $rustupHash = $digest.Groups[1].Value.ToUpperInvariant()
              if ((Get-FileHash -LiteralPath $rustup -Algorithm SHA256).Hash -cne $rustupHash) { throw 'Rustup hash mismatch' }

              $phase = 'RUST_TOOLCHAIN_INSTALL'
              $env:CARGO_HOME = Join-Path $root 'cargo'
              $env:RUSTUP_HOME = Join-Path $root 'rust'
              $env:RUSTUP_DIST_SERVER = $distribution
              $env:RUSTUP_UPDATE_ROOT = $distribution + '/rustup'
              $env:RUSTUP_AUTO_INSTALL = '0'
              $env:RUSTUP_TOOLCHAIN = $null
              # The verified binary is named rustup.exe to use CLI mode, which does not run installer setup.
              Invoke-Local $rustup @('set', 'auto-self-update', 'disable')
              Invoke-Local $rustup @('toolchain', 'install', $toolchain, '--profile', 'minimal', '--component', 'rust-docs')
              $env:RUSTUP_TOOLCHAIN = $toolchain
              $phase = 'RUST_TOOLCHAIN_VALIDATION'
              $sysroot = Join-Path $env:RUSTUP_HOME ('toolchains\' + $toolchain)
              $binDir = Join-Path $sysroot 'bin'
              Invoke-Local (Join-Path $binDir 'rustc.exe') @('-vV')
              Invoke-Local (Join-Path $binDir 'cargo.exe') @('--version')
              $detail = Get-Content -LiteralPath $log -Raw
              if ($detail -notmatch '(?m)^release: 1\.100\.0\r?$' -or
                  $detail -notmatch '(?m)^host: x86_64-pc-windows-msvc\r?$' -or
                  $detail -notmatch '(?m)^cargo 1\.100\.0(?:\s|$)') { throw 'Rust toolchain mismatch' }
              foreach ($license in @('licenses\Apache-2.0.txt', 'licenses\MIT.txt', 'COPYRIGHT-library.html')) {
                if (-not (Test-Path -LiteralPath (Join-Path $sysroot ('share\doc\rust\' + $license)) -PathType Leaf)) {
                  throw 'Rust documentation licenses missing'
                }
              }

              $phase = 'JOB_TOOLCHAIN_HANDOFF'
              foreach ($name in @('CARGO_HOME', 'RUSTUP_HOME', 'RUSTUP_DIST_SERVER', 'RUSTUP_UPDATE_ROOT', 'RUSTUP_AUTO_INSTALL', 'RUSTUP_TOOLCHAIN')) {
                [IO.File]::AppendAllText($env:GITHUB_ENV, $name + '=' + [Environment]::GetEnvironmentVariable($name) + [Environment]::NewLine)
              }
              [IO.File]::AppendAllText($env:GITHUB_ENV, 'FLOWBRIDGE_PRIVATE_PYTHON=' + $python + [Environment]::NewLine +
                'FLOWBRIDGE_PRIVATE_RUST_BIN=' + $binDir + [Environment]::NewLine)
              [IO.File]::AppendAllText($env:GITHUB_PATH, (Split-Path -Parent $python) + [Environment]::NewLine + $binDir + [Environment]::NewLine)
              $result = @{status='READY'; python=$pythonVersion; python_sha512=$pythonHash.ToLowerInvariant();
                rust=$rustVersion; rustup=$rustupVersion; rustup_sha256=$rustupHash.ToLowerInvariant();
                rustc_sha256=(Get-FileHash -LiteralPath (Join-Path $binDir 'rustc.exe') -Algorithm SHA256).Hash.ToLowerInvariant();
                cargo_sha256=(Get-FileHash -LiteralPath (Join-Path $binDir 'cargo.exe') -Algorithm SHA256).Hash.ToLowerInvariant()}
              [IO.File]::WriteAllText((Join-Path $root 'toolchain-result.json'), ($result | ConvertTo-Json))
              Report $result
            } catch {
              if ($log) { $_ | Out-String | Add-Content -LiteralPath $log -ErrorAction SilentlyContinue }
              Report @{status='BLOCKED'; phase=$phase; native_exit=$script:nativeExit}
              exit 1
            }
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command
          "try { & ([scriptblock]::Create($env:FLOWBRIDGE_PROVISION_SETUP + $env:FLOWBRIDGE_PROVISION_CODE)) }
          catch { Write-Host ('FLOWBRIDGE_TOOLCHAIN_RESULT ' + (@{status='BLOCKED'; phase='POWERSHELL_BOOTSTRAP_COMPILE'} | ConvertTo-Json -Compress)); exit 1 }" 2>nul
      - name: Inventory standard local tool installations
        shell: cmd
        working-directory: C:\
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command
          "$ErrorActionPreference = 'SilentlyContinue';
          function Present($name, [string[]]$candidates) {
          if (Get-Command $name -CommandType Application | Where-Object { $_.Source -notlike '*\Microsoft\WindowsApps\*' }) { return $true };
          foreach ($path in $candidates) { if (Test-Path -LiteralPath $path -PathType Leaf) { return $true } };
          return $false
          };
          $programs = $env:ProgramFiles;
          $localPrograms = Join-Path $env:LOCALAPPDATA 'Programs';
          $x86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)');
          $python = @(313, 314 | ForEach-Object { Join-Path $programs ('Python' + $_ + '\python.exe'); Join-Path $localPrograms ('Python\Python' + $_ + '\python.exe') });
          $vswhere = Join-Path $x86 'Microsoft Visual Studio\Installer\vswhere.exe';
          $cl = @();
          $vsCmake = @();
          if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null | Select-Object -First 1;
          if ($vs) {
          $cl = @((Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe') -File).FullName);
          $vsCmake = @(Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe')
          }
          };
          $tools = [ordered]@{
          'python.exe' = (Present 'python.exe' $python);
          'git.exe' = (Present 'git.exe' @((Join-Path $programs 'Git\cmd\git.exe'), (Join-Path $localPrograms 'Git\cmd\git.exe')));
          'cargo.exe' = (Present 'cargo.exe' @((Join-Path $env:USERPROFILE '.cargo\bin\cargo.exe')));
          'rustc.exe' = (Present 'rustc.exe' @((Join-Path $env:USERPROFILE '.cargo\bin\rustc.exe')));
          'cmake.exe' = (Present 'cmake.exe' (@((Join-Path $programs 'CMake\bin\cmake.exe'), (Join-Path $localPrograms 'CMake\bin\cmake.exe')) + $vsCmake));
          'msvc-x64' = (Present 'cl.exe' $cl);
          'windows-sdk-headers' = [bool](Get-Item (Join-Path $x86 'Windows Kits\10\Include\*\um\Windows.h') | Select-Object -First 1);
          'nsis-3.13.zip' = (Test-Path -LiteralPath 'C:\FlowBridge\toolchains\nsis-3.13.zip' -PathType Leaf)
          };
          foreach ($entry in $tools.GetEnumerator()) { if ($entry.Value) { Write-Host ('TOOL_FOUND: ' + $entry.Key) } else { Write-Host ('TOOL_MISSING: ' + $entry.Key) } }" 2>nul
      - name: Check prerequisites and build the pinned candidate privately
        shell: cmd
        working-directory: C:\
        env:
          NoDefaultCurrentDirectoryInExePath: '1'
          FLOWBRIDGE_PREFLIGHT_CODE: |
            import csv
            import ctypes
            from ctypes import wintypes
            import hashlib
            import json
            import os
            from pathlib import Path
            import re
            import shutil
            import stat
            import subprocess
            import sys

            QA = '86aace2a4696e9717bc2b4423b447a760946aa15'
            PRODUCT = '44f1fc0eba5ac1552df94f083342e25a1a764937'
            GITHUB = 'https://github.com/i-shutov/flowbridge.git'
            NSIS_URL = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
            NSIS_SHA = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
            BASE = Path(r'C:\FlowBridge\private-candidates')
            NSIS_LOCAL = BASE.parent / 'toolchains' / 'nsis-3.13.zip'
            state = {'schema': 'flowbridge-private-beta3-runner-v1', 'qa_sha': QA, 'product_sha': PRODUCT}
            local = None
            log = None
            os.environ.pop('FLOWBRIDGE_BUILD_CODE', None)
            os.environ.pop('FLOWBRIDGE_PREFLIGHT_CODE', None)

            class Blocked(Exception):
                pass

            def require(test, code):
                if not test:
                    raise Blocked(code)

            def run(args, code, *, env=None, timeout=120, capture=False):
                output = subprocess.PIPE if capture else (log or subprocess.DEVNULL)
                try:
                    proc = subprocess.run(args, stdout=output, stderr=log or subprocess.DEVNULL,
                                          env=env, timeout=timeout, check=True)
                except (OSError, subprocess.SubprocessError):
                    raise Blocked(code) from None
                return proc.stdout.decode('utf-8', 'replace').strip() if capture else None

            def reject_links(path):
                for part in [*reversed(path.parents), path]:
                    if os.path.lexists(part):
                        flags = part.lstat().st_file_attributes
                        require(not flags & stat.FILE_ATTRIBUTE_REPARSE_POINT, 'LOCAL_PATH_REPARSE_POINT')

            def checkout(git, folder, commit, env):
                run([git, 'init', '-q', str(folder)], 'CHECKOUT_INIT_FAILED', env=env)
                run([git, '-C', str(folder), 'fetch', '--no-tags', '--depth=1',
                     GITHUB, commit], 'PINNED_GITHUB_FETCH_FAILED', env=env, timeout=180)
                run([git, '-C', str(folder), 'checkout', '-q', '--detach', commit],
                    'PINNED_GITHUB_CHECKOUT_FAILED', env=env)
                actual = run([git, '-C', str(folder), 'rev-parse', 'HEAD'], 'CHECKOUT_SHA_UNAVAILABLE',
                             env=env, capture=True)
                status = run([git, '-C', str(folder), 'status', '--porcelain', '--untracked-files=all'],
                             'CHECKOUT_STATUS_UNAVAILABLE', env=env, capture=True)
                require(actual == commit and not status, 'CHECKOUT_SHA_OR_CLEANLINESS_MISMATCH')

            def check_native_and_elevated():
                require(os.name == 'nt' and sys.maxsize > 2**32, 'NATIVE_X64_WINDOWS_REQUIRED')
                kernel = ctypes.WinDLL('kernel32.dll')
                current_process = kernel.GetCurrentProcess
                current_process.restype = wintypes.HANDLE
                is_wow64 = kernel.IsWow64Process2
                is_wow64.argtypes = (wintypes.HANDLE, ctypes.POINTER(wintypes.USHORT),
                                      ctypes.POINTER(wintypes.USHORT))
                is_wow64.restype = wintypes.BOOL
                process, hardware = wintypes.USHORT(), wintypes.USHORT()
                require(is_wow64(current_process(), ctypes.byref(process), ctypes.byref(hardware))
                        and process.value == 0 and hardware.value == 0x8664,
                        'NATIVE_X64_WINDOWS_REQUIRED')
                is_admin = ctypes.WinDLL('shell32.dll').IsUserAnAdmin
                is_admin.restype = wintypes.BOOL
                require(is_admin(), 'ELEVATED_ADMIN_TOKEN_REQUIRED')

            def discover_tools():
                user = Path(os.environ['USERPROFILE'])
                app = Path(os.environ.get('LOCALAPPDATA', str(user / 'AppData/Local')))
                programs = Path(os.environ['ProgramFiles'])
                homes = {
                    'git.exe': [programs / 'Git/cmd', app / 'Programs/Git/cmd'],
                    'cargo.exe': [user / '.cargo/bin'],
                    'rustc.exe': [user / '.cargo/bin'],
                    'cmake.exe': [programs / 'CMake/bin', app / 'Programs/CMake/bin'],
                }
                if private_rust := os.environ.get('FLOWBRIDGE_PRIVATE_RUST_BIN'):
                    for tool in ('cargo.exe', 'rustc.exe'):
                        homes[tool].insert(0, Path(private_rust))
                x86 = Path(os.environ.get('ProgramFiles(x86)', str(programs)))
                vswhere = x86 / 'Microsoft Visual Studio/Installer/vswhere.exe'
                dev = None
                if vswhere.is_file():
                    install = run([str(vswhere), '-latest', '-products', '*', '-requires',
                                   'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                                   '-property', 'installationPath'], 'VSWHERE_DISCOVERY_FAILED', capture=True)
                    if install:
                        candidate = Path(install) / 'Common7/Tools/VsDevCmd.bat'
                        dev = candidate if candidate.is_file() else None
                        homes['cmake.exe'].append(Path(install) /
                            'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin')
                tools = {tool: next((str(p / tool) for p in dirs if (p / tool).is_file()), shutil.which(tool))
                         for tool, dirs in homes.items()}
                missing = [tool for tool, path in tools.items() if not path or not Path(path).is_absolute()]
                if not dev and not shutil.which('cl.exe'):
                    missing.append('msvc-x64')
                state['missing_tools'] = missing
                require(not missing, 'REQUIRED_NATIVE_TOOLS_NOT_FOUND')
                return tools, dev

          FLOWBRIDGE_BUILD_CODE: |
            def main():
                global local, log
                check_native_and_elevated()
                system = Path(os.environ['SystemRoot']) / 'System32'
                v = sys.getwindowsversion()
                require(v.product_type == 1 and (v.major, v.minor) == (10, 0) and v.build >= 22000,
                        'WINDOWS_11_CLIENT_REQUIRED')
                require(os.environ.get('COMPUTERNAME', '').casefold() == 'vm-326272'
                        and os.environ.get('RUNNER_NAME') == 'win11-flowbridge', 'WRONG_RUNNER_OR_HOST')
                account = run([str(system / 'whoami.exe')], 'SERVICE_ACCOUNT_UNAVAILABLE', capture=True)
                require(account.casefold() == r'vm-326272\admin', 'UNEXPECTED_SERVICE_ACCOUNT')
                state['windows_build'] = v.build
                state['phase'] = 'TOOL_DISCOVERY'
                tools, dev = discover_tools()

                identity = '-'.join(os.environ[name] for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'))
                require(re.fullmatch(r'[0-9]+-[0-9]+', identity), 'INVALID_RUN_ID')
                proposed = BASE / ('run-' + identity)
                reject_links(proposed)
                require(not os.path.lexists(proposed), 'PRIVATE_RUN_DIRECTORY_ALREADY_EXISTS')
                workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
                require(not proposed.is_relative_to(workspace), 'CANDIDATE_INSIDE_ACTIONS_WORKSPACE')
                proposed.mkdir(parents=True, exist_ok=False)
                sid_row = run([str(system / 'whoami.exe'), '/user', '/fo', 'csv', '/nh'],
                              'SERVICE_SID_UNAVAILABLE', capture=True)
                sid = next(csv.reader([sid_row]))[-1]
                require(re.fullmatch(r'S-1-[0-9]+(?:-[0-9]+)+', sid), 'INVALID_SERVICE_SID')
                run([str(system / 'icacls.exe'), str(proposed), '/inheritance:r', '/grant:r',
                     f'*{sid}:(OI)(CI)F', '*S-1-5-18:(OI)(CI)F', '*S-1-5-32-544:(OI)(CI)F'],
                    'PRIVATE_DIRECTORY_ACL_FAILED')
                local = proposed
                log = (local / 'private-build.log').open('xb')

                omit = {'GH_TOKEN', 'GITHUB_TOKEN', 'GITHUB_ENV', 'GITHUB_OUTPUT', 'GITHUB_PATH',
                        'GITHUB_STEP_SUMMARY', 'GITHUB_STATE', 'PYTHONHOME', 'PYTHONPATH'}
                clean = {k: v for k, v in os.environ.items()
                         if not k.startswith(('GIT_', 'ACTIONS_')) and k not in omit}
                clean.update(GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=os.devnull,
                             GIT_TERMINAL_PROMPT='0', PYTHONNOUSERSITE='1', GIT_CONFIG_COUNT='3',
                             GIT_CONFIG_KEY_0='user.name', GIT_CONFIG_VALUE_0='FlowBridge Private Build',
                             GIT_CONFIG_KEY_1='user.email', GIT_CONFIG_VALUE_1='qa@example.invalid',
                             GIT_CONFIG_KEY_2='core.autocrlf', GIT_CONFIG_VALUE_2='false')
                state['phase'] = 'NATIVE_PREFLIGHT'
                if dev:
                    require(dev.is_absolute() and '%' not in str(dev), 'MSVC_DEV_COMMAND_PATH_INVALID')
                    command = f'"{system / "cmd.exe"}" /d /s /v:off /c "call "{dev}" -no_logo -arch=x64 -host_arch=x64 >nul 2>&1 && set"'
                    variables = run(command,
                                    'MSVC_X64_ENVIRONMENT_UNAVAILABLE', env=clean, capture=True)
                    for line in variables.splitlines():
                        if '=' in line and not line.startswith('='):
                            key, value = line.split('=', 1)
                            clean[key.upper()] = value
                trusted_dirs = list(dict.fromkeys(str(Path(p).parent) for p in [*tools.values(), sys.executable]))
                clean['PATH'] = os.pathsep.join([*trusted_dirs, clean['PATH']])
                rust = run([tools['rustc.exe'], '-vV'], 'RUST_TOOLCHAIN_UNAVAILABLE', env=clean, capture=True)
                require('host: x86_64-pc-windows-msvc' in rust.splitlines(), 'RUST_MSVC_X64_REQUIRED')
                rust_ver = next((l.removeprefix('release: ') for l in rust.splitlines()
                                 if l.startswith('release: ')), '')
                rust_match = re.fullmatch(r'([0-9]+)\.([0-9]+)\.([0-9]+)', rust_ver)
                require(rust_match and tuple(map(int, rust_match.groups()[:2])) >= (1, 85),
                        'RUST_STABLE_1_85_OR_LATER_REQUIRED')
                run([tools['cargo.exe'], '--version'], 'CARGO_UNAVAILABLE', env=clean)
                cmake = run([tools['cmake.exe'], '--version'], 'CMAKE_UNAVAILABLE', env=clean, capture=True)
                ver = re.match(r'cmake version ([0-9]+)\.([0-9]+)', cmake)
                require(ver and tuple(map(int, ver.groups())) >= (3, 24), 'CMAKE_3_24_OR_LATER_REQUIRED')
                state['rust_version'] = rust_ver
                state['cmake_version'] = '.'.join(ver.groups())
                probe = local / 'probe'
                probe.mkdir()
                (probe / 'CMakeLists.txt').write_text('cmake_minimum_required(VERSION 3.24)\n'
                    'project(Probe LANGUAGES CXX)\nif(NOT MSVC)\nmessage(FATAL_ERROR "MSVC required")\nendif()\n'
                    'add_executable(probe probe.cpp)\n')
                (probe / 'probe.cpp').write_text('#include <windows.h>\n'
                    'int main() { return GetCurrentProcessId() == 0; }\n')
                run([tools['cmake.exe'], '-S', str(probe), '-B', str(probe / 'build'), '-A', 'x64'],
                    'MSVC_X64_OR_WINDOWS_SDK_UNAVAILABLE', env=clean)
                run([tools['cmake.exe'], '--build', str(probe / 'build'), '--config', 'Release'],
                    'MSVC_X64_OR_WINDOWS_SDK_UNAVAILABLE', env=clean)

                state['phase'] = 'PINNED_INPUTS'
                qa, src = local / 'qa', local / 'src'
                checkout(tools['git.exe'], qa, QA, clean)
                checkout(tools['git.exe'], src, PRODUCT, clean)
                nsis = NSIS_LOCAL
                reject_links(nsis)
                if not nsis.exists():
                    nsis = local / 'nsis-3.13.zip'
                    run([str(system / 'curl.exe'), '--proto', '=https', '--proto-redir', '=https', '--location',
                         '--fail', '--silent', '--show-error', '--max-time', '90',
                         '--max-filesize', '10000000', '--output', str(nsis), NSIS_URL],
                        'NSIS_DOWNLOAD_FAILED_PROVIDE_PINNED_LOCAL_ZIP')
                with nsis.open('rb') as archive:
                    data = archive.read(10_000_001)
                require(len(data) <= 10_000_000 and hashlib.sha256(data).hexdigest() == NSIS_SHA,
                        'NSIS_ZIP_SHA256_MISMATCH')

                state['phase'] = 'PRIVATE_BUILD'
                candidate = local / 'candidate'
                run([sys.executable, str(qa / 'tools/stage_internal_beta3.py'), '--source', str(src),
                     '--out-dir', str(candidate), '--build-windows', '--nsis-archive', str(nsis)],
                    'PRIVATE_BUILD_FAILED_INSPECT_LOCAL_LOG', env=clean, timeout=2700)
                cp = json.loads((local / 'candidate-CHECKPOINT.json').read_text(encoding='utf-8'))
                require(cp['status'] == 'PRIVATE_LOCAL_INSTALLER_BUILT_QA_NOT_ACCEPTED'
                        and cp['installer_built'] is True and cp['installer_installed'] is False
                        and cp['driver_built_or_installed'] is False
                        and cp['original_verified_source_sha'] == PRODUCT
                        and cp['public_release_or_upload_performed'] is False,
                        'CANDIDATE_CHECKPOINT_INVALID')
                keys = {'installer_sha256': 64, 'new_private_git_commit': 40, 'new_private_git_tree': 40}
                digests = {key: cp[key] for key in keys}
                require(all(isinstance(value, str) and re.fullmatch(f'[0-9a-f]{{{keys[key]}}}', value)
                            for key, value in digests.items()), 'CANDIDATE_DIGESTS_INVALID')
                state.update(digests)

            try:
                main()
                state.update(status='PRIVATE_LOCAL_INSTALLER_BUILT_QA_NOT_ACCEPTED')
            except Blocked as exc:
                state.update(status='BLOCKED', reason=str(exc))
            except Exception:
                if log:
                    import traceback
                    log.write(traceback.format_exc().encode('utf-8'))
                state.update(status='BLOCKED', reason='LOCAL_RUNNER_FAILURE')
            finally:
                if log:
                    log.close()
                if local:
                    try:
                        with (local / 'runner-result.json').open('x', encoding='utf-8') as summary:
                            json.dump(state, summary, sort_keys=True)
                    except OSError:
                        state.update(status='BLOCKED', reason='PRIVATE_SUMMARY_WRITE_FAILED')
                print('FLOWBRIDGE_RUNNER_RESULT ' + json.dumps(state, sort_keys=True))
            sys.exit(0 if state['status'] != 'BLOCKED' else 1)
        run: |
          @echo off
          call :find_python
          if errorlevel 1 (
            echo FLOWBRIDGE_RUNNER_RESULT {"schema":"flowbridge-private-beta3-runner-v1","status":"BLOCKED","reason":"PYTHON_3_13_OR_LATER_REQUIRED"}
            exit /b 1
          )
          "%FLOWBRIDGE_PYTHON%" -I -c "import os; exec(os.environ['FLOWBRIDGE_PREFLIGHT_CODE'] + os.environ['FLOWBRIDGE_BUILD_CODE'])" 2>nul
          exit /b %ERRORLEVEL%
          :find_python
          if defined FLOWBRIDGE_PRIVATE_PYTHON (
            call :probe_python "%FLOWBRIDGE_PRIVATE_PYTHON%"
            if not errorlevel 1 exit /b 0
            exit /b 1
          )
          for %%P in ("%LOCALAPPDATA%\Programs\Python\Python313\python.exe" "%LOCALAPPDATA%\Programs\Python\Python314\python.exe" "%ProgramFiles%\Python313\python.exe" "%ProgramFiles%\Python314\python.exe") do (
            call :probe_python "%%~P"
            if not errorlevel 1 exit /b 0
          )
          for /f "delims=" %%P in ('where.exe python.exe 2^>nul ^| findstr.exe /i /v /l /c:"\Microsoft\WindowsApps" /c:"C:\python.exe"') do (
            call :probe_python "%%P"
            if not errorlevel 1 exit /b 0
          )
          exit /b 1
          :probe_python
          if not exist "%~1" exit /b 1
          "%~1" -I -c "import sys; sys.exit(0 if sys.version_info >= (3,13) else 1)" >nul 2>&1
          if errorlevel 1 exit /b 1
          set "FLOWBRIDGE_PYTHON=%~1"
          exit /b 0
