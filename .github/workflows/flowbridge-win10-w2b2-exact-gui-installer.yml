name: FlowBridge W2b2 exact-beta Windows GUI + installer QA
on:
  push:
    branches:
      - docs/release-win10-vm910136-20261110
    paths:
      - .github/workflows/flowbridge-win10-w2b2-exact-gui-installer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-beta-gui-installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact approved beta PR source (NOT branch tip or test merge)
        uses: actions/checkout@v4
        with:
          ref: c339df2e4d20edf1d11d45786581a68451a71929
          persist-credentials: false
      - name: Reject source drift and inspect the protected beta scope
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          $expected='c339df2e4d20edf1d11d45786581a68451a71929'
          if($actual -cne $expected){throw 'Source pin mismatch'}
          New-Item -ItemType Directory -Force 'build/w2b2-qa'|Out-Null
          $actual|Set-Content 'build/w2b2-qa/source-commit.txt' -Encoding ascii
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-source Rust user-mode FFI + CLI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo build --locked --release -j 2 -p flowbridge-ffi -p flowbridge-cli
          if($LASTEXITCODE -ne 0){throw 'Rust build failed'}
      - name: Build exact C++ Win32 GUI and real native test harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S native/windows -B build/windows -A x64 -DFLOWBRIDGE_BUILD_NATIVE_TESTS=ON -DFLOWBRIDGE_FFI_LIBRARY="$env:GITHUB_WORKSPACE/target/release/flowbridge_ffi.dll.lib"
          if($LASTEXITCODE -ne 0){throw 'CMake configure GUI failed'}
          cmake --build build/windows --config Release --parallel 2
          if($LASTEXITCODE -ne 0){throw 'CMake native GUI build failed'}
          Copy-Item target/release/flowbridge_ffi.dll build/windows/Release/
          New-Item -ItemType Directory -Force build/windows/Release/resources|Out-Null
          Copy-Item resources/presets.json build/windows/Release/resources/
          & ./build/windows/Release/FlowBridgeRuleModelTest.exe
          if($LASTEXITCODE -ne 0){throw 'Native rule model tests failed'}
          & ./build/windows/Release/FlowBridgeNativeSmoke.exe "$env:GITHUB_WORKSPACE/build/windows/Release/FlowBridge.exe" "$env:GITHUB_WORKSPACE/build/w2b2-qa/standalone-ui.bmp"
          if($LASTEXITCODE -ne 0){throw 'Native GUI runtime smoke failed'}
      - name: Compile capture GUI helper without any driver installation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S native/windows/wfp -B build/windows-capture -A x64 -DFLOWBRIDGE_FFI_LIBRARY="$env:GITHUB_WORKSPACE/target/release/flowbridge_ffi.dll.lib"
          if($LASTEXITCODE -ne 0){throw 'Capture helper configure failed'}
          cmake --build build/windows-capture --config Release --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Capture helper build failed'}
      - name: Stage pinned portable NSIS compiler (no global installation)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/ci-setup-nsis.ps1
          if($LASTEXITCODE -ne 0){throw 'NSIS bootstrap failed'}
      - name: Build exact-source Windows installer with file hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python packaging/windows/build-installer.py --skip-build
          if($LASTEXITCODE -ne 0){throw 'NSIS package build failed'}
      - name: Real silent installed GUI + upgrade + uninstall on disposable Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/windows_installer_native.py --manifest docs/verification/windows-package.json --harness build/windows/Release/FlowBridgeNativeSmoke.exe --output build/verification/windows
          if($LASTEXITCODE -ne 0){throw 'Native Windows installer acceptance failed'}
      - name: Emit immutable target QA manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='c339df2e4d20edf1d11d45786581a68451a71929'
          $manifest=Get-Content docs/verification/windows-package.json -Raw|ConvertFrom-Json
          $installer=(Get-ChildItem artifacts -File -Filter 'FlowBridge-*-windows-x64-setup.exe' |Select-Object -First 1)
          if(-not $installer){throw 'No installer output'}
          $sha=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -cne $manifest.sha256){throw 'NSIS installer SHA mismatch'}
          $status=Get-Content build/verification/windows/native-installer-result.json -Raw|ConvertFrom-Json
          if(-not $status.passed -or $status.installer_sha256 -cne $sha){throw 'Native installer acceptance mismatch'}
          $items=@(
            'build/windows/Release/FlowBridge.exe',
            'build/windows/Release/FlowBridgeNativeSmoke.exe',
            'build/windows/Release/FlowBridgeRuleModelTest.exe',
            'build/windows/Release/flowbridge_ffi.dll',
            'build/windows/Release/resources/presets.json',
            'target/release/flowbridge.exe',
            'artifacts/'+$installer.Name
          )
          $files=@($items |ForEach-Object {
            if(-not(Test-Path -LiteralPath $_ -PathType Leaf)){throw ('Expected package file missing: '+$_)}
            [ordered]@{path=$_;sha256=(Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant();bytes=(Get-Item -LiteralPath $_).Length}
          })
          [ordered]@{
            schema='flowbridge-exact-beta-win10-gui-installer-v1'
            source_sha=$source
            signed=$false
            native_windows_hosted_qa=$true
            target_win10_physically_tested=$false
            transparent_interception=$false
            driver_installed=$false
            target_g2='NO_GO'
            installer_sha256=$sha
            files=$files
          }|ConvertTo-Json -Depth 8|Set-Content build/w2b2-qa/bundle-manifest.json -Encoding utf8
      - name: Upload exact-source Win10 QA bundle for independent physical Win10 testing
        uses: actions/upload-artifact@v4
        with:
          name: FlowBridge-W2b2-ExactBeta-GUI-Installer-${{ github.run_id }}
          path: |
            build/w2b2-qa/source-commit.txt
            build/w2b2-qa/bundle-manifest.json
            build/w2b2-qa/standalone-ui.bmp
            build/windows/Release/FlowBridge.exe
            build/windows/Release/FlowBridgeNativeSmoke.exe
            build/windows/Release/FlowBridgeRuleModelTest.exe
            build/windows/Release/flowbridge_ffi.dll
            build/windows/Release/resources/presets.json
            target/release/flowbridge.exe
            artifacts/FlowBridge-*-windows-x64-setup.exe
            artifacts/FlowBridge-*-windows-x64-setup.exe.sha256
            docs/verification/windows-package.json
            build/verification/windows/native-installer-result.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve failed build/QA evidence separately (no binaries)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FlowBridge-W2b2-Failure-Evidence-${{ github.run_id }}
          path: |
            build/w2b2-qa/
            build/verification/windows/
          retention-days: 14
          if-no-files-found: warn
