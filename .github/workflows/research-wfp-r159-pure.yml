name: Research WFP R159 — exact-source pure Windows/Ubuntu test (no driver)
on:
  push:
    branches:
      - research/windows-wfp-ale-attribution-20261107
    paths:
      - research/wfp-ale/kernel-r19/policy_plan.rs
      - research/wfp-ale/kernel-r19/broker_windows.rs
      - research/wfp-ale/kernel-r19/broker.rs
      - research/wfp-ale/r159/**
      - .github/workflows/research-wfp-r159-pure.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-wfp-r159-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure-r159:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact source hash, negative guard tests normal and Python -O
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/wfp-ale/r159/r159_source_gate.py
          if($LASTEXITCODE -ne 0){ throw 'R159 source negative suite failed' }
          python -O -B research/wfp-ale/r159/r159_source_gate.py
          if($LASTEXITCODE -ne 0){ throw 'R159 optimized negative suite failed' }
          python -B research/wfp-ale/r159/r159_source_gate.py --source-gate
          if($LASTEXITCODE -ne 0){ throw 'R159 exact-source gate failed' }
      - name: Compile original pure Rust policy plan; execute exact tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source='research/wfp-ale/kernel-r19/policy_plan.rs'
          $test=Join-Path $env:RUNNER_TEMP 'flowbridge-r159-policy-test'
          if($IsWindows){$test+='.exe'}
          rustc --edition=2021 --test $source -o $test
          if($LASTEXITCODE -ne 0){throw 'Pure Rust R159 policy compilation failed'}
          & $test --test-threads=1 --nocapture
          if($LASTEXITCODE -ne 0){throw 'Pure Rust R159 policy tests failed'}
          $sha=(Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "R159_USERMODE_ONLY_PASS; binary_sha256=$sha"
      - name: Mark test boundary explicitly
        shell: pwsh
        run: |
          Write-Host "kernel_driver_loaded=false"
          Write-Host "wfp_filters_installed=false"
          Write-Host "native_ale_classify_observed=false"
          Write-Host "no_direct_proved=false"
          Write-Host "release_accepted=false"
  broker-windows-typecheck:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Typecheck whole Windows broker against locked dependencies, no execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --locked --manifest-path research/wfp-ale/kernel-r19/broker-package/Cargo.toml --bin flowbridge-redirect-broker
          if ($LASTEXITCODE -ne 0) { throw 'Broker R159 actual Windows typecheck failed' }
          $head = (git rev-parse HEAD).Trim()
          Write-Host "R159_BROKER_WIN_TYPECHECK_PASS; source=$head; driver_installed=false; no_direct_proved=false"
