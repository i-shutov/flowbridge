name: Collect native compiler diagnostics
on:
  push:
    branches: ['work/beta-native-vertical']
    paths: ['.github/workflows/collect-compiler-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect errors from completed macOS job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, re
          url='https://api.github.com/repos/i-shutov/flowbridge/actions/jobs/123109343130/logs'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json'})
          req.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
          with urllib.request.urlopen(req,timeout=30) as r: text=r.read().decode('utf-8-sig')
          out=pathlib.Path('diagnostics');out.mkdir()
          (out/'macos-build.log').write_text(text)
          lines=text.splitlines();indices=set()
          for i,line in enumerate(lines):
              if re.search(r'error:|fatal error:|BUILD FAILED|error generated',line,re.I):
                  indices.update(range(max(0,i-2),min(len(lines),i+4)))
          selected='\n'.join(lines[i] for i in sorted(indices))
          (out/'compiler-errors.txt').write_text(selected)
          print(selected)
          PY
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-native-compiler-diagnostics
          path: diagnostics/
          retention-days: 7
