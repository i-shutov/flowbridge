name: Real Windows OpenSSH acceptance
on:
  pull_request:
    paths:
      - 'tests/*ssh*'
      - 'tests/real_owned_pool_lifecycle.py'
      - 'crates/flowbridge-tunnel/**'
      - 'crates/flowbridge-runtime/**'
      - 'crates/flowbridge-ffi/**'
      - 'crates/flowbridge-capture/**'
      - '.github/workflows/windows-real-ssh.yml'
  push:
    branches: [main]
    paths:
      - 'tests/*ssh*'
      - 'tests/real_owned_pool_lifecycle.py'
      - 'crates/flowbridge-tunnel/**'
      - 'crates/flowbridge-runtime/**'
      - 'crates/flowbridge-ffi/**'
      - 'crates/flowbridge-capture/**'
      - '.github/workflows/windows-real-ssh.yml'
  workflow_dispatch:
    inputs:
      managed_pool_512:
        description: 'Run only the strict four-worker managed 512-flow gate'
        type: boolean
        default: false
      expected_source:
        description: 'Full checkout commit SHA, required for the managed pool gate'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: windows-real-ssh-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  FLOWBRIDGE_HOSTED_WINDOWS_SSH: '1'
  FLOWBRIDGE_CAPTURE_AGENT: target/debug/flowbridge-agent.exe
jobs:
  windows-openssh:
    name: Windows OpenSSH (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.managed_pool_512 && '["managed-pool-512"]' || '["managed","raw"]') }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject false-positive capacity probes
        run: python -m unittest discover -s tests -p test_windows_ssh_probe.py -v
      - run: cargo build --locked -p flowbridge-ffi -p flowbridge-capture -p flowbridge-cli
        if: matrix.scenario != 'managed-pool-512'
      - name: Build exact release FFI and compiled Win32 pool policy
        if: matrix.scenario == 'managed-pool-512'
        shell: pwsh
        env:
          FLOWBRIDGE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $env:FLOWBRIDGE_EXPECTED_SOURCE -cne $head) { throw 'Expected full source commit does not match checkout' }
          python -m unittest discover -s tests -p test_windows_managed_ssh_pool_capacity.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Managed pool negative checks failed' }
          cargo build --locked --release -p flowbridge-ffi
          if ($LASTEXITCODE -ne 0) { throw 'Release FFI build failed' }
          cmake -S native/windows -B build/windows-pool-policy -A x64 -DFLOWBRIDGE_BUILD_NATIVE_TESTS=ON "-DFLOWBRIDGE_FFI_LIBRARY=$env:GITHUB_WORKSPACE/target/release/flowbridge_ffi.dll.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Win32 policy configure failed' }
          cmake --build build/windows-pool-policy --config Release --target FlowBridgeSshPoolRequest
          if ($LASTEXITCODE -ne 0) { throw 'Win32 policy build failed' }
      - name: Fetch pinned official sshd without installing a system service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'flowbridge-openssh-fixture'
          New-Item -ItemType Directory -Force $root | Out-Null
          $archive = Join-Path $root 'OpenSSH-Win64.zip'
          Invoke-WebRequest 'https://github.com/PowerShell/Win32-OpenSSH/releases/download/10.4.0.0p1-Preview/OpenSSH-Win64.zip' -OutFile $archive
          $expected = 'b67ff8becd203502190ec42ac7787c24c2cd3325ed7700485fe7a1c83d2a7957'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Official fixture ZIP hash mismatch' }
          Expand-Archive $archive -DestinationPath $root
          $server = Join-Path $root 'OpenSSH-Win64/sshd.exe'
          $client = Join-Path $env:WINDIR 'System32/OpenSSH/ssh.exe'
          $keygen = Join-Path $env:WINDIR 'System32/OpenSSH/ssh-keygen.exe'
          foreach ($path in @($server, $client, $keygen)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw 'Required explicitly selected binary missing; no fallback' }
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Microsoft signature verification failed' }
          }
          "FLOWBRIDGE_TEST_SSHD=$server" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FLOWBRIDGE_TEST_SSH=$client" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FLOWBRIDGE_TEST_KEYGEN=$keygen" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FLOWBRIDGE_TEST_SSH_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force "build/verification/windows-real-ssh/${{ matrix.scenario }}" | Out-Null
          @{fixture_server_release='10.4.0.0p1-Preview'; server_zip_sha256=$expected; microsoft_signatures_valid=$true; system_ssh_client=$true; system_service_installed=$false} | ConvertTo-Json | Set-Content "build/verification/windows-real-ssh/${{ matrix.scenario }}/provenance.json"
      - name: Actual Windows OpenSSH ${{ matrix.scenario }} scenario
        if: matrix.scenario != 'managed-pool-512'
        shell: pwsh
        run: |
          python tests/windows_real_ssh_hosted.py --scenario "${{ matrix.scenario }}" --ssh "$env:FLOWBRIDGE_TEST_SSH" --sshd "$env:FLOWBRIDGE_TEST_SSHD" --keygen "$env:FLOWBRIDGE_TEST_KEYGEN" --library target/debug/flowbridge_ffi.dll --output "build/verification/windows-real-ssh/${{ matrix.scenario }}" --churn 10000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows 512-flow owned SSH pool
        if: matrix.scenario == 'managed-pool-512'
        shell: pwsh
        env:
          FLOWBRIDGE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'target/release/flowbridge_ffi.dll'
          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          python tests/windows_real_ssh_hosted.py --scenario managed-pool-512 --ssh "$env:FLOWBRIDGE_TEST_SSH" --sshd "$env:FLOWBRIDGE_TEST_SSHD" --keygen "$env:FLOWBRIDGE_TEST_KEYGEN" --library $dll --output 'build/verification/windows-real-ssh/managed-pool-512' --pool-policy build/windows-pool-policy/Release/FlowBridgeSshPoolRequest.exe --fixture-archive "$env:FLOWBRIDGE_TEST_SSH_ARCHIVE" --expect-source-sha "$env:FLOWBRIDGE_EXPECTED_SOURCE" --expect-ffi-sha256 $hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.0
        if: github.event.repository.private == true && (always())
        with:
          name: FlowBridge-real-Windows-OpenSSH-${{ matrix.scenario }}
          path: build/verification/windows-real-ssh/${{ matrix.scenario }}/*.json
          if-no-files-found: warn
          retention-days: 14
