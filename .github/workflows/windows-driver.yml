name: windows-wfp-driver
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/windows/wfp/**'
      - '.github/workflows/windows-driver.yml'
      - 'tools/wfp_signing_package.py'
      - 'tests/test_wfp_signing_package.py'
      - 'docs/qa/WFP_MICROSOFT_SIGNING.md'
  pull_request:
    paths:
      - 'native/windows/wfp/**'
      - '.github/workflows/windows-driver.yml'
      - 'tools/wfp_signing_package.py'
      - 'tests/test_wfp_signing_package.py'
      - 'docs/qa/WFP_MICROSOFT_SIGNING.md'
permissions:
  contents: read
concurrency:
  group: wfp-driver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wdk-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pinned Microsoft WDK and SDK
        run: nuget restore native/windows/wfp/driver/packages.config -PackagesDirectory native/windows/wfp/driver/packages -NonInteractive
      - name: Compile WFP callout with WDK and validate driver package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $project = "$root\native\windows\wfp\driver\FlowBridgeWfp.vcxproj"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw '64-bit MSBuild was not found' }
          $packages = (Resolve-Path native/windows/wfp/driver/packages).Path
          $toolDirs = @()
          $stampPath = $null
          foreach ($name in @('stampinf.exe', 'infverif.exe', 'inf2cat.exe')) {
            $candidates = @(Get-ChildItem -Path $packages -Filter $name -Recurse -File)
            $tool = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if (-not $tool) { $tool = $candidates | Select-Object -First 1 }
            if (-not $tool) { throw "Pinned WDK is missing $name" }
            Write-Host "$name : $($tool.FullName)"
            $toolDirs += $tool.DirectoryName
            if ($name -eq 'stampinf.exe') { $stampPath = $tool.DirectoryName + '\' }
          }
          $verifyDll = Get-ChildItem -Path $packages -Filter InfVerif.dll -Recurse -File | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $verifyDll) { throw 'Pinned WDK is missing the x64 InfVerif runtime' }
          $runtimeRoot = $verifyDll.Directory.Parent.FullName
          Write-Host "InfVerif native runtime root: $runtimeRoot"
          $env:PATH = (($toolDirs | Select-Object -Unique) -join ';') + ';' + $env:PATH
          New-Item -ItemType Directory -Force "$root\build\wfp-driver" | Out-Null
          # WDK's managed task loads x64/InfVerif.dll relative to its runtime root.
          # Use the real NuGet tool layout, without disabling INF verification.
          Push-Location $runtimeRoot
          try {
            & $msbuild $project /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off "/p:StampInfToolPath=$stampPath" "/p:OutDir=$root\build\wfp-driver\" "/bl:$root\build\wfp-driver-build.binlog"
            if ($LASTEXITCODE -ne 0) { throw "WDK build failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          if (-not (Test-Path build/wfp-driver/FlowBridgeWfp.sys)) { throw 'Driver binary was not produced' }
          Get-FileHash build/wfp-driver/FlowBridgeWfp.sys -Algorithm SHA256 | Format-List
      - name: Prepare and verify unsigned CAB input (never sign or install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -p 'test_wfp_signing_package.py' -v
          if ($LASTEXITCODE -ne 0) { throw "WFP signing-input regressions failed" }
          python tools/wfp_signing_package.py --package-dir build/wfp-driver/FlowBridgeWfp --pdb build/wfp-driver/FlowBridgeWfp.pdb --out-dir build/wfp-signing-input --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Unsigned WFP submission-input verification failed" }
          $report = Get-Content build/wfp-signing-input/wfp-signing-input.json -Raw | ConvertFrom-Json
          if (-not $report.cabinet_generated_and_byte_verified -or $report.microsoft_hardware_signature_verified) {
            throw "Wrong unsigned WFP signing-input classification"
          }
      - name: Upload unsigned Partner Center input (NOT signed or loadable)
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-WFP-UNSIGNED-SIGNING-INPUT
          path: build/wfp-signing-input/
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned development driver
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-WFP-UNSIGNED-DEVELOPMENT
          path: |
            build/wfp-driver/
            native/windows/wfp/driver/DEVELOPMENT-ONLY.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload WDK diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FlowBridge-WFP-build-log
          path: build/wfp-driver-build.binlog
          if-no-files-found: warn
          retention-days: 14
# Compilation is NOT kernel activation, signed distribution, or a traffic test.
# Never install or start an unsigned kernel driver on a hosted runner.
