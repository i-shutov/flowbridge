name: Win11 release acceptance read-only preflight

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: win11-vps-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'i-shutov/flowbridge' }}
    runs-on: [self-hosted, Windows, X64, win11-flowbridge]
    timeout-minutes: 5
    steps:
      - name: Inspect Win11 desktop availability and existing installation metadata
        shell: cmd
        working-directory: C:\
        env:
          FLOWBRIDGE_ACCEPTANCE_PREFLIGHT: |
            import ctypes
            import hashlib
            import os
            from pathlib import Path
            import socket
            import stat
            import sys
            import urllib.request

            PROBE_SOURCE = '562ac8fb5087d820a4b213b08dffb24c4ed1680e'
            PROBE_SHA256 = '89fcff121b1cd12c6b8a0e315bfdf73599157dd1d11e79cc713a90a73230e858'
            phase = 'EXPECTED_WIN11_RUNNER'
            try:
                if (os.name != 'nt' or sys.maxsize <= 2**32
                        or socket.gethostname().casefold() != 'vm-326272'
                        or os.environ.get('RUNNER_NAME') != 'win11-flowbridge'
                        or not ctypes.windll.shell32.IsUserAnAdmin()):
                    raise RuntimeError('unexpected runner')
                version = sys.getwindowsversion()
                if version.product_type != 1 or version.build < 22000:
                    raise RuntimeError('Windows 11 workstation required')
                for path in (Path(sys.executable), Path('C:/FlowBridge/private-candidates')):
                    for part in (*reversed(path.parents), path):
                        info = part.lstat()
                        if stat.S_ISLNK(info.st_mode) or info.st_file_attributes & 0x400:
                            raise RuntimeError('unsafe local path')
                phase = 'PINNED_PREFLIGHT_SOURCE'
                url = (f'https://raw.githubusercontent.com/i-shutov/flowbridge/{PROBE_SOURCE}'
                       '/tools/win11_explicit_beta_preflight.py')
                with urllib.request.urlopen(url, timeout=20) as response:
                    payload = response.read(262145)
                if not 0 < len(payload) <= 262144 or hashlib.sha256(payload).hexdigest() != PROBE_SHA256:
                    raise RuntimeError('preflight source mismatch')
                phase = 'READ_ONLY_HOST_AND_SESSION_CHECKS'
                print('FLOWBRIDGE_PREFLIGHT_SOURCE=' + PROBE_SOURCE)
                print('FLOWBRIDGE_PREFLIGHT_SHA256=' + PROBE_SHA256)
                sys.argv = ['win11_explicit_beta_preflight.py']
                exec(compile(payload, 'verified_win11_preflight', 'exec'),
                     {'__name__': '__main__', '__file__': 'verified_win11_preflight'})
            except Exception:
                print('FLOWBRIDGE_ACCEPTANCE_PREFLIGHT_BLOCKED=' + phase)
                sys.exit(1)
        run: |
          @echo off
          "C:\FlowBridge\private-candidates\toolchain-45986630920-1\python\tools\python.exe" -I -c "import os; exec(os.environ['FLOWBRIDGE_ACCEPTANCE_PREFLIGHT'])" 2>nul
          exit /b %ERRORLEVEL%
