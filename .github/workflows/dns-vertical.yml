name: Native DNS vertical
on:
  pull_request:
    paths: ['crates/**','native/**','tests/native_dns_integration.py','.github/workflows/dns-vertical.yml']
  push:
    branches: [main]
    paths: ['crates/**','native/**','tests/native_dns_integration.py','.github/workflows/dns-vertical.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dns-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dns:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04,windows-2025,macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo build --locked -p flowbridge-ffi
      - run: python tests/native_dns_integration.py --output build/verification/dns/result.json
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: FlowBridge-DNS-${{ matrix.os }}
          path: build/verification/dns/
          if-no-files-found: warn
          retention-days: 14
