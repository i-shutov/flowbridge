# Manual trusted-main hardware smoke: NO checkout and NO third-party code.
# NEVER run pull_request or pull_request_target jobs on this privileged host.
name: Windows 11 VPS runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win11-vps-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  windows11-native:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'i-shutov/flowbridge' }}
    runs-on: [self-hosted, Windows, X64, win11-flowbridge]
    timeout-minutes: 5
    steps:
      - name: Verify Windows host, service identity and tool availability
        shell: cmd
        env:
          EXPECTED_RUNNER: win11-flowbridge
          EXPECTED_COMPUTER: VM-326272
          EXPECTED_ACCOUNT: VM-326272\Admin
        # cmd runs a single inline command under the existing PowerShell policy.
        run: >-
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command
          "$ErrorActionPreference = 'Stop';
          if ($env:COMPUTERNAME -ine $env:EXPECTED_COMPUTER) { throw 'Unexpected host' };
          if ($env:RUNNER_NAME -ine $env:EXPECTED_RUNNER) { throw 'Unexpected runner' };
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent();
          if ($identity.Name -ine $env:EXPECTED_ACCOUNT) { throw 'Unexpected service identity' };
          $principal = [Security.Principal.WindowsPrincipal]::new($identity);
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Expected elevated administrator service token' };
          $os = Get-CimInstance Win32_OperatingSystem;
          if ($os.ProductType -ne 1 -or $os.Caption -notmatch 'Windows 11' -or [int]$os.BuildNumber -lt 22000) { throw 'Expected Windows 11 client' };
          $cpus = @(Get-CimInstance Win32_Processor);
          if ($env:RUNNER_ARCH -ne 'X64' -or $os.OSArchitecture -notmatch '64' -or $cpus.Count -eq 0 -or @($cpus | Where-Object Architecture -ne 9).Count -ne 0) { throw 'Expected native x64 Windows' };
          Write-Host ('WINDOWS_VERSION: {0} build {1}' -f $os.Caption, $os.BuildNumber);
          Write-Host ('POWERSHELL_EXECUTION_POLICY: ' + (Get-ExecutionPolicy));
          foreach ($tool in @('cargo.exe', 'rustc.exe', 'git.exe', 'ssh.exe', 'python.exe', 'cmake.exe', 'cl.exe', 'msbuild.exe', 'makensis.exe', 'codex.exe', 'codex.cmd')) { if (Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue) { Write-Host ('TOOL_FOUND: ' + $tool) } else { Write-Host ('TOOL_MISSING: ' + $tool) } };
          Write-Host 'RUNNER_SMOKE_PASS'; exit 0"
