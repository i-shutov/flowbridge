name: FlowBridge
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: 'arm64 x86_64'
    ONLY_ACTIVE_ARCH: NO
    FLOWBRIDGE_BUNDLE_ID: 'org.flowbridge.FlowBridge'
    SWIFT_OBJC_BRIDGING_HEADER: '$(SRCROOT)/../include/flowbridge.h'
    HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../include']
    LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/lib/universal']
    OTHER_LDFLAGS: ['$(inherited)', '-lflowbridge_ffi', '-framework', Security, '-framework', SystemConfiguration, '-liconv', '-lresolv']
targetTemplates:
  AppBase:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: ../../resources/presets.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: FlowBridge
        PRODUCT_BUNDLE_IDENTIFIER: '$(FLOWBRIDGE_BUNDLE_ID)'
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge
        LSMinimumSystemVersion: '13.0'
        NSHighResolutionCapable: true
        NSSystemExtensionUsageDescription: 'FlowBridge uses its system extension to route selected outgoing TCP connections according to your profile.'
targets:
  FlowBridgeLocal:
    templates: [AppBase]
    settings:
      base:
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGN_STYLE: Manual
  FlowBridge:
    templates: [AppBase]
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - target: FlowBridgeExtension
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) FLOWBRIDGE_NATIVE'
        CODE_SIGN_ENTITLEMENTS: App/FlowBridge.entitlements
        PROVISIONING_PROFILE_SPECIFIER: '$(FLOWBRIDGE_APP_PROFILE)'
  FlowBridgeExtension:
    type: system-extension
    platform: macOS
    sources: [Extension, Shared]
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: '$(FLOWBRIDGE_BUNDLE_ID).extension'
        PRODUCT_MODULE_NAME: FlowBridgeExtension
        PRODUCT_BUNDLE_IDENTIFIER: '$(FLOWBRIDGE_BUNDLE_ID).extension'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Extension/FlowBridgeExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: '$(FLOWBRIDGE_EXTENSION_PROFILE)'
        SKIP_INSTALL: YES
    info:
      path: Generated/Extension-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge TCP Proxy
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).TransparentProxyProvider
            com.apple.networkextension.dns-proxy: $(PRODUCT_MODULE_NAME).DNSProxyProvider
          NEMachServiceName: '$(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)'
schemes:
  FlowBridgeLocal:
    build:
      targets:
        FlowBridgeLocal: all
  FlowBridge:
    build:
      targets:
        FlowBridge: all
