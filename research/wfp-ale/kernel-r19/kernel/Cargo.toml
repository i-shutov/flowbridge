[package]
name = "flowbridge-g2-witness"
version = "0.0.1"
edition = "2021"
publish = false
build = "build.rs"
[lib]
crate-type = ["cdylib"]
[workspace]
[build-dependencies]
bindgen = "=0.71.1"
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
# Produce matching MSVC PDB for Microsoft automated kernel crash analysis.
debug = "full"
opt-level = 2
lto = false
codegen-units = 1
