[package]
name = "flowbridge-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
flowbridge-core.workspace = true
flowbridge-net.workspace = true
flowbridge-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
